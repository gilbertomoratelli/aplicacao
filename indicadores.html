<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Indicadores do Negócio · Auditor de Precificação</title>
<link rel="stylesheet" href="shared.css">
<style>
  /* Ajustes desta página sobre o padrão do shared.css */
  .wrap{max-width:520px}
  .brand{margin-bottom:28px}
  .stepper{margin-bottom:24px}
  .card{padding:0;overflow:hidden;margin-bottom:14px}

  .page-title{font-size:20px;font-weight:800;letter-spacing:-.3px;margin:0 0 4px}
  .page-sub{font-size:13px;color:var(--muted);margin:0 0 18px}

  .card-head{padding:14px 18px;border-bottom:1px solid var(--hair);display:flex;align-items:center;gap:10px}
  .card-icon{width:30px;height:30px;border-radius:8px;background:#E9F7EF;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
  .card-head h3{margin:0;font-size:12px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--ink)}
  .card-body{padding:4px 18px 10px}

  .ind-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--hair)}
  .ind-row:last-child{border-bottom:none}
  .ind-left{flex:1;min-width:0}
  .ind-label{font-size:13px;color:var(--ink);font-weight:600}
  .ind-sub{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.4}
  .ind-right{text-align:right;flex-shrink:0}
  .ind-val{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--ink)}
  .ind-val.pct{color:var(--teal)}
  .ind-val.empty{color:var(--muted);font-style:italic;font-family:var(--sans);font-size:12px;font-weight:400}
  .ind-tag{font-size:10px;font-weight:600;font-family:var(--mono);background:var(--bg);border:1px solid var(--hair);border-radius:5px;padding:2px 7px;color:var(--muted);margin-top:4px;display:inline-block}

  .lucro-destaque{text-align:center;padding:20px 18px 18px}
  .lucro-pct{font-size:56px;font-weight:800;font-family:var(--mono);color:var(--teal);line-height:1;letter-spacing:-2px}
  .lucro-hint{font-size:12px;color:var(--muted);margin-top:8px}

  .bar-wrap{padding:0 0 10px}
  .bar-bg{background:var(--hair);border-radius:4px;height:7px;overflow:hidden}
  .bar-fill{height:100%;border-radius:4px;transition:.6s ease}
</style>
</head>
<body>
<div class="wrap">
  <a class="btn-back" href="sazonalidade.html">← Voltar</a>

  <div class="brand">
    <div class="logo"><svg viewBox="0 0 509 534" width="36" height="36" xmlns="http://www.w3.org/2000/svg"><path fill="#40C1AC" d="M223,16L318,252c4,9,4,20,0,29L223,518c-4,10-13,16-24,16h-77c-11,0-20-6-24-16L3,282c-4-9-4-20,0-29L98,16C102,6,112,0,122,0h77C210,0,219,6,223,16z"/><path fill="#00B140" d="M386,0h-99l104,252c4,10,4,20,0,30L287,534h99c11,0,20-6,24-16l97-241c3-6,3-13,0-19L410,16C406,6,397,0,386,0z"/></svg></div>
    <div>
      <div class="brand-name">Auditor de Precificação</div>
      <div class="brand-sub">FAVO Educação</div>
    </div>
  </div>

  <nav class="stepper" id="stepper"></nav>

  <div class="empresa-badge">
    <div>
      <div class="nome" id="empresaNome">—</div>
      <div class="regime" id="empresaRegime">—</div>
    </div>
    <button class="btn-trocar" onclick="trocarEmpresa()">Trocar empresa</button>
  </div>

  <h2 class="page-title">Indicadores do Negócio</h2>
  <p class="page-sub">Resumo dos parâmetros cadastrados — revise antes de prosseguir para a precificação.</p>

  <div id="alertBanner" class="alert-banner" role="alert" aria-live="assertive" style="display:none"></div>

  <!-- Card 1: Meta de Resultado -->
  <div class="card">
    <div class="card-head">
      <div class="card-icon">🎯</div>
      <h3>Meta de Resultado</h3>
    </div>
    <div class="card-body">
      <div class="lucro-destaque">
        <div class="lucro-pct" id="lucroValor">—</div>
        <div class="lucro-hint">Margem de lucro desejada por projeto</div>
      </div>
    </div>
  </div>

  <!-- Card 2: Estrutura de Custos Diretos -->
  <div class="card">
    <div class="card-head">
      <div class="card-icon">🔧</div>
      <h3>Estrutura de Custos Diretos</h3>
    </div>
    <div class="card-body" id="custosBody"></div>
  </div>

  <!-- Card 3: Despesas Variáveis -->
  <div class="card">
    <div class="card-head">
      <div class="card-icon">📊</div>
      <h3>Despesas Variáveis</h3>
    </div>
    <div class="card-body" id="despVarBody"></div>
  </div>

  <!-- Card 4: Despesas Fixas -->
  <div class="card">
    <div class="card-head">
      <div class="card-icon">📋</div>
      <h3>Despesas Fixas</h3>
    </div>
    <div class="card-body" id="despFixaBody"></div>
  </div>

  <button class="btn-primary" onclick="location.href='projeto.html'">Continuar → Dados do Projeto</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app-core.js"></script>
<script>
const db = AppCore.getClient(
  'https://dfsmwzmtainiclcwpigw.supabase.co',
  'sb_publishable_trZuSsmSkPKN9Ry0WytyUg_xn7UYBo3'
);

const integrador   = AppCore.safeParse('integrador', null);
let configCustos   = AppCore.safeParse('configCustos', {});
let custosExtras   = AppCore.safeParse('custosExtras', []);
const despesas     = AppCore.safeParse('despesas', {});
const sazon        = AppCore.safeParse('sazonalidade', {});

if (!integrador?.nome_empresa) { location.href = 'cadastro.html'; }

document.getElementById('empresaNome').textContent   = integrador?.nome_empresa        || '—';
document.getElementById('empresaRegime').textContent = integrador?.regime_tributario   || '—';

// C-9: se configCustos vazio no localStorage e db disponível, buscar do DB (aninhado: configs.campos / configs.extras).
async function hidratarCustosDoDB() {
  const vazio = !configCustos || Object.keys(configCustos).length === 0;
  if (!vazio || !db || !integrador?.id) return;
  const { data } = await AppCore.dbTry(
    db.from('integradores').select('configs').eq('id', integrador.id).single()
  );
  if (data?.configs?.campos) {
    configCustos = data.configs.campos;
    if (Array.isArray(data.configs.extras)) custosExtras = data.configs.extras;
    renderCustos();
  }
}

function brl(v) {
  return 'R$ ' + (Number(v) || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtPct(v) {
  return Number(v || 0).toFixed(1).replace('.', ',') + '%';
}

function indRow(label, sub, valHtml) {
  return `<div class="ind-row">
    <div class="ind-left">
      <div class="ind-label">${label}</div>
      ${sub ? `<div class="ind-sub">${sub}</div>` : ''}
    </div>
    <div class="ind-right">${valHtml}</div>
  </div>`;
}

// ── Card 1: Meta de Resultado ─────────────────────────────────────────
const lucroDefinido = integrador?.lucro_alvo != null;
const lucroAlvo = integrador?.lucro_alvo ?? 12;
document.getElementById('lucroValor').textContent = fmtPct(lucroAlvo);

// ── Card 2: Custos Diretos ────────────────────────────────────────────
const CAMPOS = {
  ca:    'Material adicional CA',
  inst:  'Instalação',
  proj:  'Projeto elétrico',
  homol: 'Homologação',
  art:   'ART do Projeto',
};

function cfgInfo(cfg) {
  if (!cfg?.modo) return null;
  if (cfg.modo === 'fixo')   return { val: brl(cfg.taxa),           tag: 'Valor fixo' };
  if (cfg.modo === 'modulo') return { val: brl(cfg.taxa) + ' / mod', tag: 'Por módulo' };
  if (cfg.modo === 'kwp')    return { val: brl(cfg.taxa) + ' / kWp', tag: 'Por kWp' };
  if (cfg.modo === 'faixa')  return { val: 'Por faixa',             tag: 'Faixa configurada' };
  return null;
}

function renderCustos() {
  let custosHtml = '';
  for (const [id, label] of Object.entries(CAMPOS)) {
    const info = cfgInfo(configCustos[id]);
    const valHtml = info
      ? `<div class="ind-val">${info.val}</div><div class="ind-tag">${info.tag}</div>`
      : `<div class="ind-val empty">Não configurado</div>`;
    custosHtml += indRow(label, null, valHtml);
  }
  for (const extra of custosExtras) {
    if (!extra.label) continue;
    const info    = cfgInfo(extra);
    const valHtml = info
      ? `<div class="ind-val">${info.val}</div><div class="ind-tag">${info.tag}</div>`
      : `<div class="ind-val empty">Não configurado</div>`;
    custosHtml += indRow(AppCore.escapeHtml(extra.label), 'Custo adicional configurado', valHtml);
  }
  if (!custosHtml) custosHtml = indRow('Nenhum custo configurado', 'Acesse a tela Custos para configurar', '<div class="ind-val empty">—</div>');
  document.getElementById('custosBody').innerHTML = custosHtml;
}
renderCustos();
hidratarCustosDoDB();

// ── Card 3: Despesas Variáveis ────────────────────────────────────────
function baseLabel(b) { return b === 'servico' ? 'Sobre serviços' : 'Sobre venda total'; }

const comissao = despesas.comissao;
const tributo  = despesas.tributo;
const dvExtras = Array.isArray(despesas.extras) ? despesas.extras : [];
let dvHtml = '';

const comissaoInformada = comissao?.valor != null && comissao?.valor !== '';
const tributoInformado  = tributo?.valor != null && tributo?.valor !== '';

dvHtml += indRow(
  'Comissão de vendas',
  comissaoInformada ? baseLabel(comissao.base) : 'Não informada',
  comissaoInformada
    ? `<div class="ind-val pct">${fmtPct(comissao.valor)}</div>`
    : `<div class="ind-val empty">0,0%</div>`
);

dvHtml += indRow(
  'Carga tributária',
  tributoInformado ? baseLabel(tributo.base) : 'Não informada',
  tributoInformado
    ? `<div class="ind-val pct">${fmtPct(tributo.valor)}</div>`
    : `<div class="ind-val empty">0,0%</div>`
);

for (const e of dvExtras) {
  if (!e.nome) continue;
  dvHtml += indRow(
    AppCore.escapeHtml(e.nome),
    baseLabel(e.base),
    `<div class="ind-val pct">${fmtPct(e.valor)}</div>`
  );
}

document.getElementById('despVarBody').innerHTML = dvHtml;

// ── Card 4: Despesas Fixas ────────────────────────────────────────────
const despFixa = AppCore.parseNum(despesas.despFixa);

const mesesData = sazon.meses || {};
const totalValorAnual = Object.values(mesesData).reduce((s, m) => s + AppCore.parseNum(m.valor), 0);
const fatMedioMensal  = totalValorAnual / 12;
const despPct         = fatMedioMensal > 0 ? (despFixa / fatMedioMensal) * 100 : 0;

let dfHtml = indRow(
  'Despesas fixas mensais',
  'Valor total cadastrado na tela Despesas',
  `<div class="ind-val">${brl(despFixa)}</div>`
);

if (fatMedioMensal > 0) {
  const cor = despPct > 30 ? 'var(--negative)' : despPct > 20 ? 'var(--solar)' : 'var(--teal)';
  const fillClass = despPct > 30 ? 'background:var(--negative)' : despPct > 20 ? 'background:var(--solar)' : 'background:var(--teal)';
  dfHtml += indRow(
    '% sobre faturamento médio mensal',
    `Faturamento médio: ${brl(fatMedioMensal)} / mês`,
    `<div class="ind-val pct" style="color:${cor}">${fmtPct(despPct)}</div>`
  );
  dfHtml += `<div class="bar-wrap"><div class="bar-bg"><div class="bar-fill" style="width:${Math.min(despPct, 100).toFixed(1)}%;${fillClass}"></div></div></div>`;
} else {
  dfHtml += indRow(
    '% sobre faturamento médio mensal',
    'Preencha o Diagnóstico de Sazonalidade para calcular',
    `<div class="ind-val empty">—</div>`
  );
}

document.getElementById('despFixaBody').innerHTML = dfHtml;

// ── Alertas ───────────────────────────────────────────────────────────
const alertas = [];
if (!lucroDefinido)  alertas.push('Lucro desejado não definido — acesse a tela <strong>Empresa</strong> para configurar.');
if (!despFixa)   alertas.push('Despesas fixas zeradas — verifique a tela <strong>Despesas</strong>.');
if (!comissaoInformada && !tributoInformado) alertas.push('Despesas variáveis não configuradas — acesse a tela <strong>Despesas</strong>.');
if (fatMedioMensal === 0) alertas.push('Diagnóstico de Sazonalidade não preenchido — os indicadores estarão incompletos na precificação.');

const banner = document.getElementById('alertBanner');
if (alertas.length) {
  banner.style.display = 'block';
  banner.innerHTML = '<strong>⚠ Atenção:</strong><br>' + alertas.map(a => '· ' + a).join('<br>');
}

function trocarEmpresa() {
  localStorage.removeItem('integrador');
  location.href = 'cadastro.html';
}
AppCore.renderStepper('stepper','indicadores');
</script>
</body>
</html>

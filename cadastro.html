<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro da Empresa · Auditor de Precificação</title>
<link rel="stylesheet" href="shared.css">
<style>
  /* Exclusivo desta página. Tokens, base, stepper, card, formulário
     e botões vêm do shared.css. */
  .returning{background:#EEF7F2;border:1px solid #BEE0CC;border-radius:10px;padding:14px 16px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .returning .nome{font-weight:700;font-size:14px;color:var(--teal)}
  .returning .hint{font-size:12px;color:var(--muted)}
  .btn-cont{background:var(--teal);color:#fff;border:none;border-radius:8px;padding:10px 14px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:var(--sans);min-height:var(--toque)}
  .btn-cont:hover{opacity:.9}

  .divider{display:flex;align-items:center;gap:10px;margin:20px 0;color:var(--muted);font-size:12px}
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--hair)}

  .foot-note{text-align:center;font-size:12px;color:var(--muted);margin-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="logo"><svg viewBox="0 0 509 534" width="36" height="36" xmlns="http://www.w3.org/2000/svg"><path fill="#40C1AC" d="M223,16L318,252c4,9,4,20,0,29L223,518c-4,10-13,16-24,16h-77c-11,0-20-6-24-16L3,282c-4-9-4-20,0-29L98,16C102,6,112,0,122,0h77C210,0,219,6,223,16z"/><path fill="#00B140" d="M386,0h-99l104,252c4,10,4,20,0,30L287,534h99c11,0,20-6,24-16l97-241c3-6,3-13,0-19L410,16C406,6,397,0,386,0z"/></svg></div>
    <div>
      <div class="brand-name">Auditor de Precificação</div>
      <div class="brand-sub">FAVO Educação</div>
    </div>
  </div>

  <nav class="stepper" id="stepper"></nav>

  <div class="card">
    <h2 class="card-title">Vamos começar pela sua empresa</h2>
    <p class="card-sub">São só quatro campos. No fim você recebe um diagnóstico do seu preço atual.</p>

    <div class="returning" id="returning" style="display:none">
      <div>
        <div class="nome" id="retNome"></div>
        <div class="hint">Dados salvos anteriormente</div>
      </div>
      <button class="btn-cont" onclick="continuar()">Continuar →</button>
    </div>
    <div id="dividerRet" style="display:none"><div class="divider">ou preencha novamente</div></div>

    <form id="form" onsubmit="salvar(event)">
      <label class="fld">
        <span class="lbl">Nome da Empresa <span class="req">*</span></span>
        <input class="plain" type="text" id="nome_empresa" placeholder="Ex: Solar Norte Energia" autocomplete="organization" aria-required="true">
        <span class="err" id="errNome" role="alert" aria-live="assertive">Campo obrigatório</span>
      </label>

      <label class="fld">
        <span class="lbl">CNPJ <span class="req">*</span></span>
        <input class="plain" type="text" id="cnpj" placeholder="00.000.000/0000-00" maxlength="18" inputmode="numeric" oninput="mascaraCNPJ(this)" aria-required="true">
        <span class="err" id="errCnpj" role="alert" aria-live="assertive"></span>
      </label>

      <label class="fld">
        <span class="lbl">E-mail <span class="req">*</span></span>
        <input class="plain" type="email" id="email" placeholder="contato@suaempresa.com.br" autocomplete="email" aria-required="true">
        <span class="err" id="errEmail" role="alert" aria-live="assertive">E-mail inválido</span>
      </label>

      <label class="fld">
        <span class="lbl">WhatsApp <span class="req">*</span></span>
        <input class="plain" type="tel" id="whatsapp" placeholder="(00) 00000-0000" maxlength="15" oninput="mascaraTel(this)" aria-required="true">
        <span class="err" id="errWhats" role="alert" aria-live="assertive">Campo obrigatório</span>
      </label>

    </form>
  </div>

  <button class="btn-primary" id="btnSalvar" onclick="document.getElementById('form').requestSubmit()" style="margin-top:20px">Continuar →</button>

  <p class="foot-note">Seus dados ficam salvos neste navegador para uso futuro.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app-core.js"></script>
<script>
const db = AppCore.getClient(AppConfig.supabaseUrl, AppConfig.supabaseKey);

function mascaraCNPJ(el) {
  let v = el.value.replace(/\D/g,'').slice(0,14);
  if(v.length>12) v=v.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,'$1.$2.$3/$4-$5');
  else if(v.length>8) v=v.replace(/(\d{2})(\d{3})(\d{3})(\d+)/,'$1.$2.$3/$4');
  else if(v.length>5) v=v.replace(/(\d{2})(\d{3})(\d+)/,'$1.$2.$3');
  else if(v.length>2) v=v.replace(/(\d{2})(\d+)/,'$1.$2');
  el.value=v;
}
function cnpjValido(str) {
  const c = String(str).replace(/\D/g,'');
  if (c.length !== 14) return false;
  if (/^(\d)\1{13}$/.test(c)) return false;
  const dv = (base, pesos) => {
    const soma = base.reduce((s,n,i)=>s+n*pesos[i],0);
    const r = soma % 11;
    return r < 2 ? 0 : 11 - r;
  };
  const nums = c.split('').map(Number);
  const p1 = [5,4,3,2,9,8,7,6,5,4,3,2];
  const p2 = [6,5,4,3,2,9,8,7,6,5,4,3,2];
  const d1 = dv(nums.slice(0,12), p1);
  const d2 = dv(nums.slice(0,12).concat(d1), p2);
  return d1 === nums[12] && d2 === nums[13];
}
function mascaraTel(el) {
  let v = el.value.replace(/\D/g,'').slice(0,11);
  if(v.length>10) v=v.replace(/(\d{2})(\d{5})(\d{4})/,'($1) $2-$3');
  else if(v.length>6) v=v.replace(/(\d{2})(\d{4})(\d*)/,'($1) $2-$3');
  else if(v.length>2) v=v.replace(/(\d{2})(\d*)/,'($1) $2');
  el.value=v;
}

function carregarSalvo() {
  const salvo = AppCore.safeParse('integrador', null);
  if(salvo?.nome_empresa) {
    document.getElementById('retNome').textContent = salvo.nome_empresa;
    document.getElementById('returning').style.display='flex';
    document.getElementById('dividerRet').style.display='block';
    document.getElementById('nome_empresa').value = salvo.nome_empresa||'';
    document.getElementById('cnpj').value = salvo.cnpj||'';
    document.getElementById('email').value = salvo.email||'';
    document.getElementById('whatsapp').value = salvo.whatsapp||'';
  }
}

function continuar() {
  window.location.href = 'projeto.html';
}

// Cada campo declara a própria regra e a mensagem do erro. A mensagem é função
// do valor para separar "não preencheu" de "preencheu errado", dizer só
// "inválido" obriga o usuário a adivinhar o que corrigir.
const CAMPOS_OBRIGATORIOS=[
  {id:'nome_empresa',err:'errNome',
   check:v=>v.trim().length>1,
   msg:()=>'Informe o nome da empresa'},
  {id:'cnpj',err:'errCnpj',
   check:v=>cnpjValido(v),
   msg:v=>v.trim()===''?'Informe o CNPJ da empresa':'CNPJ inválido. Confira os 14 dígitos'},
  {id:'email',err:'errEmail',
   check:v=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v),
   msg:v=>v.trim()===''?'Informe o e-mail de contato':'E-mail inválido. Exemplo: contato@suaempresa.com.br'},
  {id:'whatsapp',err:'errWhats',
   check:v=>v.replace(/\D/g,'').length>=10,
   msg:v=>v.trim()===''?'Informe o WhatsApp':'WhatsApp incompleto. Inclua o DDD'},
];

function validar() {
  return AppCore.validarCampos(CAMPOS_OBRIGATORIOS);
}

async function salvar(e) {
  e.preventDefault();
  if(!validar()) return;

  const btn=document.getElementById('btnSalvar');
  btn.disabled=true; btn.textContent='Salvando…';

  const salvo = AppCore.safeParse('integrador', null);

  // Regime tributário e margem-alvo agora são perguntados no passo Custos, onde
  // ficam ao lado da carga tributária e fazem sentido para o usuário. Aqui eles
  // só são preservados: quem volta para corrigir o contato não perde o que já
  // respondeu adiante.
  const payload={
    nome_empresa: document.getElementById('nome_empresa').value.trim(),
    cnpj: document.getElementById('cnpj').value.trim(),
    regime_tributario: salvo?.regime_tributario ?? null,
    email: document.getElementById('email').value.trim(),
    whatsapp: document.getElementById('whatsapp').value.trim(),
  };

  const lucroAlvoVal = salvo?.lucro_alvo ?? 12;

  // Grava no localStorage antes do DB, com um id garantido: nunca bloqueia o avanço do usuário (funciona offline).
  const id = salvo?.id || AppCore.uuid();
  localStorage.setItem('integrador', JSON.stringify({...payload, id, lucro_alvo: lucroAlvoVal}));

  // Sync opcional com o DB: atualiza se já existe um registro salvo, senão cria um novo.
  if (db) {
    let data, error;
    if (salvo?.id) {
      ({data,error} = await AppCore.dbTry(db.from('integradores').update(payload).eq('id', salvo.id).select().single()));
      if (!data || error?.code === 'PGRST116') {
        ({data,error} = await AppCore.dbTry(db.from('integradores').insert(payload).select().single()));
      }
    } else {
      ({data,error} = await AppCore.dbTry(db.from('integradores').insert(payload).select().single()));
    }
    if (!error && data?.id) {
      localStorage.setItem('integrador', JSON.stringify({...payload, id: data.id, lucro_alvo: lucroAlvoVal}));
    }
  }

  btn.disabled=false; btn.textContent='Continuar →';
  window.location.href='projeto.html';
}

AppCore.renderStepper('stepper','contato');
carregarSalvo();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro da Empresa · Auditor de Precificação</title>
<link rel="stylesheet" href="shared.css">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  /* Exclusivo desta página. Tokens, base, marca, stepper, cartão,
     formulário e botões vêm do shared.css. */

  /* Retorno de quem já preencheu: linha com destaque de ação, não banner.
     Continuar é a ação principal de quem volta. */
  .returning{
    background:var(--fundo-3);border-radius:var(--r-ctrl);padding:var(--e3) var(--e4);
    margin-bottom:var(--e4);display:flex;align-items:center;justify-content:space-between;gap:var(--e3);
  }
  .returning .nome{font-weight:640;font-size:var(--body);letter-spacing:-.012em}
  .returning .hint{font-size:var(--footnote);color:var(--label-3);margin-top:1px}
  .btn-cont{
    background:var(--verde-t);color:var(--verde);border-radius:var(--r-cap);
    padding:9px 16px;font-size:var(--subhead);font-weight:620;
    white-space:nowrap;min-height:38px;
  }
  .btn-cont:hover{background:rgba(0,168,60,.18)}

  .divider{
    display:flex;align-items:center;gap:var(--e3);margin:var(--e5) 0;
    color:var(--label-3);font-size:var(--footnote);text-transform:uppercase;
    letter-spacing:.04em;font-weight:600;
  }
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--separador)}

  .foot-note{text-align:center;font-size:var(--footnote);color:var(--label-3);margin-top:var(--e4)}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <img class="logo-h" src="img/logo-favo-horizontal.svg" alt="FAVO Educação">
    <div class="brand-name">Auditor de Precificação</div>
  </div>

  <nav class="stepper" id="stepper"></nav>

  <div class="card form">
    <h2 class="card-title">Dados da Integradora</h2>
    <p class="card-sub">Preencha os dados da empresa responsável pelo projeto.</p>

    <div class="returning" id="returning" style="display:none">
      <div>
        <div class="nome" id="retNome"></div>
        <div class="hint">Dados salvos anteriormente</div>
      </div>
      <button class="btn-cont" onclick="continuar()">Continuar →</button>
    </div>
    <div id="dividerRet" style="display:none"><div class="divider">ou preencha novamente</div></div>

    <form id="form" onsubmit="salvar(event)">
      <label class="fld fld-full">
        <span class="lbl">Nome da Empresa <span class="req">*</span></span>
        <input class="plain" type="text" id="nome_empresa" placeholder="Ex: Solar Norte Energia" autocomplete="organization" aria-required="true">
        <span class="err" id="errNome" role="alert" aria-live="assertive">Campo obrigatório</span>
      </label>

      <label class="fld">
        <span class="lbl">CNPJ</span>
        <input class="plain" type="text" id="cnpj" placeholder="00.000.000/0000-00" maxlength="18" oninput="mascaraCNPJ(this)">
        <span class="err" id="errCnpj" role="alert" aria-live="assertive">CNPJ inválido</span>
      </label>

      <label class="fld">
        <span class="lbl">Regime Tributário <span class="req">*</span></span>
        <select class="plain" id="regime" aria-required="true">
          <option value="">Selecione…</option>
          <option value="MEI">MEI</option>
          <option value="Simples Nacional">Simples Nacional</option>
          <option value="Lucro Presumido">Lucro Presumido</option>
          <option value="Lucro Real">Lucro Real</option>
        </select>
        <span class="err" id="errRegime" role="alert" aria-live="assertive">Selecione um regime</span>
      </label>

      <label class="fld">
        <span class="lbl">E-mail <span class="req">*</span></span>
        <input class="plain" type="email" id="email" placeholder="contato@suaempresa.com.br" autocomplete="email" aria-required="true">
        <span class="err" id="errEmail" role="alert" aria-live="assertive">E-mail inválido</span>
      </label>

      <label class="fld">
        <span class="lbl">WhatsApp <span class="req">*</span></span>
        <input class="plain" type="tel" id="whatsapp" placeholder="(00) 00000-0000" maxlength="15" oninput="mascaraTel(this)" aria-required="true">
        <span class="err" id="errWhats" role="alert" aria-live="assertive">Campo obrigatório</span>
      </label>


      <span class="sec-label fld-full">Margem de lucro desejada</span>

      <label class="fld">
        <span class="lbl">Margem de lucro líquida alvo</span>
        <div class="inwrap">
          <input type="number" id="lucro_alvo" placeholder="12" min="0" max="100" step="0.1" oninput="salvarLucroAlvo()">
          <span class="affix r">%</span>
        </div>
        <span class="hint">Meta usada no preço sugerido da precificação.</span>
      </label>

    </form>
  </div>

  <button class="btn-primary" id="btnSalvar" onclick="document.getElementById('form').requestSubmit()" style="margin-top:20px">Continuar →</button>

  <p class="foot-note">Seus dados ficam salvos neste navegador para uso futuro.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app-core.js"></script>
<script>
// Endereço e chave vêm do config.js (local ou produção, conforme o host).
const db = AppCore.getClient(AppConfig.supabaseUrl, AppConfig.supabaseKey);

// O stepper é derivado de AppCore.PASSOS: nenhuma página repete a marcação.
AppCore.renderStepper('stepper', 'empresa');

function mascaraCNPJ(el) {
  let v = el.value.replace(/\D/g,'').slice(0,14);
  if(v.length>12) v=v.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,'$1.$2.$3/$4-$5');
  else if(v.length>8) v=v.replace(/(\d{2})(\d{3})(\d{3})(\d+)/,'$1.$2.$3/$4');
  else if(v.length>5) v=v.replace(/(\d{2})(\d{3})(\d+)/,'$1.$2.$3');
  else if(v.length>2) v=v.replace(/(\d{2})(\d+)/,'$1.$2');
  el.value=v;
}
function cnpjValido(str) {
  const c = String(str).replace(/\D/g,'');
  if (c.length !== 14) return false;
  if (/^(\d)\1{13}$/.test(c)) return false;
  const dv = (base, pesos) => {
    const soma = base.reduce((s,n,i)=>s+n*pesos[i],0);
    const r = soma % 11;
    return r < 2 ? 0 : 11 - r;
  };
  const nums = c.split('').map(Number);
  const p1 = [5,4,3,2,9,8,7,6,5,4,3,2];
  const p2 = [6,5,4,3,2,9,8,7,6,5,4,3,2];
  const d1 = dv(nums.slice(0,12), p1);
  const d2 = dv(nums.slice(0,12).concat(d1), p2);
  return d1 === nums[12] && d2 === nums[13];
}
function mascaraTel(el) {
  let v = el.value.replace(/\D/g,'').slice(0,11);
  if(v.length>10) v=v.replace(/(\d{2})(\d{5})(\d{4})/,'($1) $2-$3');
  else if(v.length>6) v=v.replace(/(\d{2})(\d{4})(\d*)/,'($1) $2-$3');
  else if(v.length>2) v=v.replace(/(\d{2})(\d*)/,'($1) $2');
  el.value=v;
}

function salvarLucroAlvo() {
  if (document.getElementById('lucro_alvo').value.trim() === '') return;
  const val = AppCore.parseNum(document.getElementById('lucro_alvo').value);
  const salvo = AppCore.safeParse('integrador', {});
  localStorage.setItem('integrador', JSON.stringify({...salvo, lucro_alvo: val}));
}

function carregarSalvo() {
  const salvo = AppCore.safeParse('integrador', null);
  if(salvo?.nome_empresa) {
    document.getElementById('retNome').textContent = salvo.nome_empresa;
    document.getElementById('returning').style.display='flex';
    document.getElementById('dividerRet').style.display='block';
    document.getElementById('nome_empresa').value = salvo.nome_empresa||'';
    document.getElementById('cnpj').value = salvo.cnpj||'';
    document.getElementById('regime').value = salvo.regime_tributario||'';
    document.getElementById('email').value = salvo.email||'';
    document.getElementById('whatsapp').value = salvo.whatsapp||'';
  }
  if (salvo?.lucro_alvo != null) {
    document.getElementById('lucro_alvo').value = salvo.lucro_alvo;
  } else {
    document.getElementById('lucro_alvo').value = 12;
  }
}

function continuar() {
  window.location.href = 'configuracoes.html?onboarding=1';
}

function validar() {
  let ok=true;
  const campos=[
    {id:'nome_empresa',err:'errNome',check:v=>v.trim().length>1},
    {id:'regime',err:'errRegime',check:v=>v!==''},
    {id:'email',err:'errEmail',check:v=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)},
    {id:'whatsapp',err:'errWhats',check:v=>v.replace(/\D/g,'').length>=10},
  ];
  campos.forEach(c=>{
    const v=document.getElementById(c.id).value;
    const valido=c.check(v);
    document.getElementById(c.err).style.display=valido?'none':'block';
    if(!valido) ok=false;
  });
  const cnpjVal=document.getElementById('cnpj').value.trim();
  const cnpjOk=cnpjVal==='' || cnpjValido(cnpjVal);
  document.getElementById('errCnpj').style.display=cnpjOk?'none':'block';
  if(!cnpjOk) ok=false;
  return ok;
}

async function salvar(e) {
  e.preventDefault();
  if(!validar()) return;

  const btn=document.getElementById('btnSalvar');
  btn.disabled=true; btn.textContent='Salvando…';

  const payload={
    nome_empresa: document.getElementById('nome_empresa').value.trim(),
    cnpj: document.getElementById('cnpj').value.trim()||null,
    regime_tributario: document.getElementById('regime').value,
    email: document.getElementById('email').value.trim(),
    whatsapp: document.getElementById('whatsapp').value.trim(),
  };

  const salvo = JSON.parse(localStorage.getItem('integrador')||'null');
  const lucroAlvoVal = AppCore.parseNum(document.getElementById('lucro_alvo').value) || 12;

  // Sync com o banco: nunca bloqueia o avanço (a tela funciona offline).
  // Quem já tem cadastro é ATUALIZADO — reenviar o formulário não pode criar
  // um segundo integrador. Se a linha sumiu do banco, cai para insert.
  let dbId = null;
  if (db) {
    let {data,error} = salvo?.id
      ? await AppCore.dbTry(db.from('integradores').update(payload).eq('id', salvo.id).select().single())
      : await AppCore.dbTry(db.from('integradores').insert(payload).select().single());

    if (salvo?.id && (!data || error?.code === 'PGRST116')) {
      ({data,error} = await AppCore.dbTry(db.from('integradores').insert(payload).select().single()));
    }
    if (!error && data?.id) dbId = data.id;
  }

  // Grava no localStorage independente do banco; preserva o id real quando vier.
  const id = dbId || salvo?.id || AppCore.uuid();
  localStorage.setItem('integrador', JSON.stringify({...payload, id, lucro_alvo: lucroAlvoVal}));

  btn.disabled=false; btn.textContent='Continuar →';
  window.location.href='configuracoes.html?onboarding=1';
}

carregarSalvo();
</script>
</body>
</html>

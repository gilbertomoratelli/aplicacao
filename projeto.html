<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dados do Projeto · Auditor de Precificação</title>
<link rel="stylesheet" href="shared.css">
<style>
  /* Tudo que esta página usa vem do shared.css. */
</style>
</head>
<body>
<div class="wrap">
  <a class="btn-back" href="cadastro.html">← Voltar</a>
  <div class="brand">
    <div class="logo"><svg viewBox="0 0 509 534" width="36" height="36" xmlns="http://www.w3.org/2000/svg"><path fill="#40C1AC" d="M223,16L318,252c4,9,4,20,0,29L223,518c-4,10-13,16-24,16h-77c-11,0-20-6-24-16L3,282c-4-9-4-20,0-29L98,16C102,6,112,0,122,0h77C210,0,219,6,223,16z"/><path fill="#00B140" d="M386,0h-99l104,252c4,10,4,20,0,30L287,534h99c11,0,20-6,24-16l97-241c3-6,3-13,0-19L410,16C406,6,397,0,386,0z"/></svg></div>
    <div>
      <div class="brand-name">Auditor de Precificação</div>
      <div class="brand-sub">FAVO Educação</div>
    </div>
  </div>

  <nav class="stepper" id="stepper"></nav>

  <div class="empresa-badge" id="empresaBadge">
    <div>
      <div class="nome" id="empresaNome">—</div>
      <div class="regime" id="empresaRegime">—</div>
    </div>
    <button class="btn-trocar" onclick="trocarEmpresa()">Trocar empresa</button>
  </div>

  <div class="card">
    <h2 class="card-title">Dados do Projeto</h2>
    <p class="card-sub">Use um projeto típico da sua empresa. É com ele que vamos calcular o seu preço.</p>

    <form id="form" onsubmit="salvar(event)">
      <label class="fld">
        <span class="lbl">Nome do Projeto <span class="req">*</span></span>
        <input class="plain" type="text" id="nome_projeto" placeholder="Ex: Residencial João Silva" aria-required="true">
        <span class="err" id="errNome" role="alert" aria-live="assertive">Campo obrigatório</span>
      </label>

      <label class="fld">
        <span class="lbl">Quantidade de Módulos <span class="req">*</span></span>
        <div class="inwrap">
          <input type="number" id="qtd_modulos" placeholder="0" min="1" step="1" aria-required="true">
          <span class="affix r">un</span>
        </div>
        <span class="err" id="errModulos" role="alert" aria-live="assertive">Informe a quantidade</span>
      </label>

      <label class="fld">
        <span class="lbl">Potência do Sistema <span class="req">*</span></span>
        <div class="inwrap">
          <input type="number" id="kwp_sistema" placeholder="0,00" min="0.01" step="0.01" aria-required="true">
          <span class="affix r">kWp</span>
        </div>
        <span class="hint">Potência total instalada em quilowatt-pico</span>
        <span class="err" id="errKwp" role="alert" aria-live="assertive">Informe a potência</span>
      </label>

      <label class="fld">
        <span class="lbl">Custo KIT Distribuidora <span class="req">*</span></span>
        <div class="inwrap">
          <span class="affix l">R$</span>
          <input type="text" inputmode="decimal" id="custo_kit" placeholder="0,00" aria-required="true">
        </div>
        <span class="hint">Valor faturado pela distribuidora para este projeto</span>
        <span class="err" id="errKit" role="alert" aria-live="assertive">Informe o custo do KIT</span>
      </label>

      <div id="custosFixosContainer"></div>

      <label class="fld">
        <span class="lbl" style="font-size:14px;font-weight:700;color:var(--ink)">Valor de Venda Atual</span>
        <div class="inwrap" style="border-width:2px;border-color:var(--teal)">
          <span class="affix l" style="font-size:16px;font-weight:700">R$</span>
          <input type="text" inputmode="decimal" id="valor_venda" placeholder="0,00" style="font-size:22px;font-weight:700;padding:14px 12px">
        </div>
        <span class="hint">Preço praticado hoje (KIT + serviço). Preenche o campo de análise automaticamente.</span>
      </label>

      <button class="btn-primary" type="submit" id="btnSalvar">Continuar →</button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app-core.js"></script>
<script>
const db = AppCore.getClient(AppConfig.supabaseUrl, AppConfig.supabaseKey);

const integrador = AppCore.safeParse('integrador', null);
const projetoAtual = AppCore.safeParse('projeto', null);

const LABEL_CUSTO = {
  ca:    'Material adicional CA',
  inst:  'Instalação',
  proj:  'Projeto elétrico',
  homol: 'Homologação',
  art:   'ART do Projeto',
};

function renderCustosFixos() {
  const cfgMap = JSON.parse(localStorage.getItem('configCustos') || '{}');
  const container = document.getElementById('custosFixosContainer');
  const camposFixos = Object.keys(LABEL_CUSTO).filter(k => cfgMap[k]?.modo === 'fixo');
  if (!camposFixos.length) { container.innerHTML = ''; return; }
  const salvos = projetoAtual?.custos_diretos || {};
  let html = '<div style="border-top:1px solid var(--hair);margin:8px 0 16px;padding-top:16px"><span class="lbl" style="display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:14px">Custos do projeto</span>';
  camposFixos.forEach(k => {
    const taxa = cfgMap[k]?.taxa ?? 0;
    const val  = salvos[k] !== undefined ? salvos[k] : taxa;
    html += `<label class="fld"><span class="lbl">${LABEL_CUSTO[k]}</span>
      <div class="inwrap"><span class="affix l">R$</span>
        <input type="text" inputmode="decimal" id="cd_${k}" value="${Number(val).toFixed(2).replace('.',',')}" placeholder="0,00">
      </div></label>`;
  });
  html += '</div>';
  container.innerHTML = html;
}

function init() {
  if(!integrador?.nome_empresa) {
    window.location.href='cadastro.html';
    return;
  }
  document.getElementById('empresaNome').textContent = integrador.nome_empresa;
  const regimeEl = document.getElementById('empresaRegime');
  regimeEl.textContent = integrador.regime_tributario || '';
  regimeEl.style.display = integrador.regime_tributario ? '' : 'none';

  if (projetoAtual) {
    document.getElementById('nome_projeto').value    = projetoAtual.nome_projeto        || '';
    document.getElementById('qtd_modulos').value     = projetoAtual.quantidade_modulos  || '';
    document.getElementById('kwp_sistema').value     = projetoAtual.kwp_sistema         || '';
    document.getElementById('custo_kit').value       = projetoAtual.custo_kit != null ? Number(projetoAtual.custo_kit).toFixed(2).replace('.',',') : '';
    document.getElementById('valor_venda').value     = projetoAtual.valor_venda != null ? Number(projetoAtual.valor_venda).toFixed(2).replace('.',',') : '';
    document.getElementById('btnSalvar').textContent = 'Atualizar projeto →';
  }
  renderCustosFixos();
}

function trocarEmpresa() {
  localStorage.removeItem('integrador');
  window.location.href='cadastro.html';
}

const CAMPOS_OBRIGATORIOS=[
  {id:'nome_projeto',err:'errNome',
   check:v=>v.trim().length>1,
   msg:()=>'Dê um nome para identificar este projeto'},
  {id:'qtd_modulos',err:'errModulos',
   check:v=>{const n=AppCore.parseNum(v);return Number.isInteger(n)&&n>0;},
   msg:v=>v.trim()===''?'Informe a quantidade de módulos':'Use um número inteiro maior que zero'},
  {id:'kwp_sistema',err:'errKwp',
   check:v=>parseFloat(v)>0,
   msg:v=>v.trim()===''?'Informe a potência do sistema':'A potência precisa ser maior que zero'},
  {id:'custo_kit',err:'errKit',
   check:v=>v.trim().length>0 && AppCore.parseNum(v)>0,
   msg:v=>v.trim()===''?'Informe o custo do KIT':'O custo precisa ser maior que zero'},
];

function validar() {
  return AppCore.validarCampos(CAMPOS_OBRIGATORIOS);
}

async function salvar(e) {
  e.preventDefault();
  if(!validar()) return;

  const btn=document.getElementById('btnSalvar');
  btn.disabled=true; btn.textContent='Salvando…';

  const valorVenda = AppCore.parseNum(document.getElementById('valor_venda').value) || null;

  const payload={
    integrador_id: integrador.id||null,
    nome_projeto: document.getElementById('nome_projeto').value.trim(),
    quantidade_modulos: AppCore.parseNum(document.getElementById('qtd_modulos').value),
    kwp_sistema: parseFloat(document.getElementById('kwp_sistema').value),
    custo_kit: AppCore.parseNum(document.getElementById('custo_kit').value),
    valor_venda: valorVenda,
  };

  const custos_diretos = {};
  Object.keys(LABEL_CUSTO).forEach(k => {
    const el = document.getElementById('cd_' + k);
    if (el) custos_diretos[k] = AppCore.parseNum(el.value) || 0;
  });

  // Grava no localStorage antes do DB, com um id garantido: nunca bloqueia o avanço do usuário (funciona offline).
  const localId = projetoAtual?.id || AppCore.uuid();
  localStorage.setItem('projeto', JSON.stringify({...payload, id: localId, valor_venda: valorVenda, custos_diretos}));

  // Sync opcional com o DB: atualiza se já existe um registro salvo, senão cria um novo.
  let data = null, error = null;
  if (db) {
    if (projetoAtual?.id) {
      ({data,error} = await AppCore.dbTry(db.from('projetos').update(payload).eq('id', projetoAtual.id).select().single()));
      // Registro não existe na base atual (ID de outro ambiente): tenta inserir
      if (!data || error?.code === 'PGRST116') {
        ({data,error} = await AppCore.dbTry(db.from('projetos').insert(payload).select().single()));
      }
    } else {
      ({data,error} = await AppCore.dbTry(db.from('projetos').insert(payload).select().single()));
    }

    // Falha de sincronização não é problema do usuário: o dado já está salvo
    // localmente e o funil segue normalmente. Interromper com um alerta (ainda
    // por cima com mensagem técnica do Postgres) transforma um não-evento em
    // erro assustador bem no meio da captação. Fica no console, para quem
    // desenvolve: que é quem pode agir a respeito.
    if (error) console.warn('Projeto salvo localmente; sincronização com o servidor falhou:', error.message);

    // Preserva o id real do DB quando vier, sem sobrescrever com o local.
    if (data) {
      localStorage.setItem('projeto', JSON.stringify({...payload, id: data.id, valor_venda: valorVenda, custos_diretos}));
    }
  }

  btn.disabled=false; btn.textContent= projetoAtual?.id ? 'Atualizar projeto →' : 'Continuar →';

  window.location.href='custos.html';
}

AppCore.renderStepper('stepper','projeto');
init();
</script>
</body>
</html>

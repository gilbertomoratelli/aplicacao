<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relatório de Precificação · Auditor de Precificação</title>
<link rel="stylesheet" href="shared.css">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  /* O relatório é um DOCUMENTO: ele existe para virar PDF em A4. Por isso
     ele não vira painel de duas colunas — tela e PDF passariam a mostrar
     coisas diferentes, e um documento de página larga não cabe em 210mm.
     A otimização de desktop aqui é outra: dar a ele a presença de uma
     folha sobre a mesa, trazer a tipografia para a rampa do sistema, e
     usar colunas SÓ onde o conteúdo tolera e a impressão desfaz. */
  body{padding:0;display:block;background:var(--fundo)}

  /* ── Barra de ações (some na impressão) ───────────────────── */
  .acoes{
    position:sticky;top:0;z-index:10;
    background:rgba(255,253,248,.78);backdrop-filter:blur(24px) saturate(180%);
    -webkit-backdrop-filter:blur(24px) saturate(180%);
    border-bottom:.5px solid var(--separador);
    padding:var(--e3) var(--e5);display:flex;gap:var(--e3);
    justify-content:center;align-items:center;flex-wrap:wrap;
  }
  .acoes a,.acoes button{
    font-family:var(--sans);font-size:var(--subhead);font-weight:620;border-radius:12px;
    padding:10px 18px;cursor:pointer;text-decoration:none;border:none;
    background:var(--preenche);color:var(--label);min-height:42px;
    display:inline-flex;align-items:center;gap:6px;
    transition:background var(--rapido) var(--mola),transform var(--rapido) var(--mola);
  }
  .acoes a:hover,.acoes button:hover{background:rgba(16,31,26,.10)}
  .acoes .destaque{background:var(--verde);color:#fff}
  .acoes .destaque:hover{background:#009435}
  .acoes .destaque:active{transform:scale(.97)}

  /* ── A folha ──────────────────────────────────────────────── */
  /* Na tela é papel sobre a mesa: superfície nata, canto e respiro. Na
     impressão volta a ser a própria página. */
  .folha{max-width:820px;margin:0 auto;padding:var(--e7) var(--e6) var(--e8)}
  @media (min-width:900px){
    .folha{
      margin:var(--e6) auto var(--e8);background:var(--fundo-2);
      border:1px solid var(--separador);border-radius:var(--r-cartao);
      padding:var(--e8) var(--e8) var(--e8);
    }
  }

  /* ── Capa ─────────────────────────────────────────────────── */
  .capa{border-bottom:2px solid var(--label);padding-bottom:var(--e5);margin-bottom:var(--e7)}
  .capa-marca{display:flex;align-items:center;gap:var(--e3);margin-bottom:var(--e6)}
  .capa h1{font-size:var(--largeTitle);font-weight:700;letter-spacing:-.026em;line-height:1.12;margin:0 0 var(--e1);text-wrap:balance}
  .capa .quando{font-size:var(--footnote);color:var(--label-2);margin:0}
  .capa-dados{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--e4);margin-top:var(--e5)}
  .capa-dados .rot{font-size:var(--caption2);font-weight:650;text-transform:uppercase;letter-spacing:.05em;color:var(--label-3);margin-bottom:3px}
  .capa-dados .val{font-size:var(--subhead);font-weight:640;overflow-wrap:anywhere}

  /* ── Seção ────────────────────────────────────────────────── */
  section{margin-bottom:var(--e7);break-inside:avoid}
  .sec-num{font-family:var(--mono);font-size:var(--caption2);font-weight:600;color:var(--verde);letter-spacing:.1em}
  section>h2{font-size:var(--title2);font-weight:670;letter-spacing:-.018em;margin:2px 0 var(--e1);text-wrap:balance}
  section>.intro{font-size:var(--subhead);color:var(--label-2);margin:0 0 var(--e5);line-height:1.55;max-width:66ch}

  /* ── Resumo ───────────────────────────────────────────────── */
  /* Fundo em tinta clara, não bloco escuro: um retângulo escuro grande
     numa folha A4 gasta tinta e fica pesado no papel. */
  .resumo{border:none;border-radius:var(--r-cartao);padding:var(--e6);background:var(--corSuave)}
  .resumo .selo{display:inline-flex;align-items:center;gap:6px;font-size:var(--footnote);font-weight:620;
    padding:5px 12px;border-radius:var(--r-cap);background:rgba(255,255,255,.7);color:var(--cor);margin-bottom:var(--e4)}
  .resumo .numero{font-family:var(--mono);font-size:clamp(30px,5vw,44px);font-weight:600;line-height:1;
    letter-spacing:-.045em;color:var(--cor);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
  .resumo .legenda{font-size:var(--headline);font-weight:640;margin:var(--e2) 0 var(--e3)}
  .resumo p{margin:0;font-size:var(--subhead);color:var(--label-2);line-height:1.6;max-width:66ch}
  .resumo .piso{margin-top:var(--e5);padding-top:var(--e4);border-top:1px solid var(--separador);
    font-size:var(--subhead);line-height:1.7;color:var(--label)}
  .resumo .piso b{font-family:var(--mono);font-weight:600}
  .resumo .nota{display:block;margin-top:var(--e2);font-size:var(--footnote);font-weight:640;color:var(--teal-marca)}

  /* ── Tabelas ──────────────────────────────────────────────── */
  .rolagem{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:var(--subhead)}
  thead th{font-size:var(--caption2);font-weight:650;text-transform:uppercase;letter-spacing:.05em;color:var(--label-3);
    padding:0 0 var(--e2) var(--e4);text-align:right;white-space:nowrap}
  thead th:first-child{text-align:left;padding-left:0}
  tbody td{padding:10px 0 10px var(--e4);border-top:1px solid var(--separador);font-family:var(--mono);
    text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  tbody td:first-child{text-align:left;padding-left:0;font-family:var(--sans);color:var(--label);white-space:normal}
  tbody td:first-child small{display:block;color:var(--label-3);font-size:var(--caption)}
  tbody tr.total td{border-top:1.5px solid var(--label-4);font-weight:650;font-size:var(--callout);padding-top:12px}
  tbody tr.destaque td{background:var(--mint)}
  .pos{color:var(--verde)}
  .neg{color:var(--telha)}
  .mudo{color:var(--label-3)}

  .barra{height:6px;border-radius:var(--r-cap);background:var(--preenche);overflow:hidden;margin-top:7px}
  .barra i{display:block;height:100%;border-radius:var(--r-cap)}

  /* ── Cartões ──────────────────────────────────────────────── */
  .cartoes{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:var(--e3)}
  .cartao{border:none;border-radius:var(--r-lista);padding:var(--e5);background:var(--fundo-3)}
  .cartao .rot{font-size:var(--caption2);font-weight:650;text-transform:uppercase;letter-spacing:.05em;color:var(--label-3);margin-bottom:var(--e2)}
  .cartao .val{font-family:var(--mono);font-size:var(--title2);font-weight:600;line-height:1;letter-spacing:-.03em;overflow-wrap:anywhere}
  .cartao .obs{font-size:var(--footnote);color:var(--label-2);margin-top:7px;line-height:1.45}

  /* ── Ações ────────────────────────────────────────────────── */
  .acao{border:none;border-radius:var(--r-lista);padding:var(--e5);background:var(--fundo-3);margin-bottom:var(--e3);break-inside:avoid}
  .acao .tag{display:inline-block;font-size:var(--caption2);font-weight:650;text-transform:uppercase;letter-spacing:.05em;
    padding:4px 10px;border-radius:var(--r-cap);background:var(--corSuave);color:var(--cor);margin-bottom:var(--e2)}
  .acao h3{margin:0 0 6px;font-size:var(--callout);font-weight:650;letter-spacing:-.01em}
  .acao p{margin:0;font-size:var(--subhead);color:var(--label-2);line-height:1.6;max-width:66ch}
  .acao p+p{margin-top:var(--e2)}
  .acao b{color:var(--label);font-family:var(--mono);font-weight:600}

  /* Numa folha larga, blocos de recomendação lado a lado aproveitam a
     largura sem virar dashboard. A impressão desfaz — em A4 a coluna
     única é o que mantém o texto legível. */
  @media (min-width:900px){
    .acoes-lista{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--e3);align-items:start}
    .acoes-lista .acao{margin-bottom:0}
  }

  /* ── Premissas ────────────────────────────────────────────── */
  .premissas{background:var(--fundo-3);border:none;border-radius:var(--r-lista);padding:var(--e5)}
  .premissas dl{display:grid;grid-template-columns:1fr auto;gap:9px var(--e5);margin:0 0 var(--e4);font-size:var(--footnote)}
  .premissas dt{color:var(--label-2);min-width:0}
  .premissas dd{margin:0;font-family:var(--mono);font-weight:600;text-align:right;white-space:nowrap}
  @media (min-width:900px){
    .premissas dl{grid-template-columns:1fr auto 1fr auto;column-gap:var(--e6)}
  }
  .premissas ul{margin:0 0 var(--e4);padding-left:18px;font-size:var(--footnote);color:var(--label-2);line-height:1.7}
  .ressalva{font-size:var(--caption);color:var(--label-2);background:var(--fundo);border-radius:var(--r-ctrl);padding:var(--e4);line-height:1.6}

  .rodape{border-top:1px solid var(--separador);padding-top:var(--e4);text-align:center;font-size:var(--caption2);color:var(--label-3);line-height:1.7}

  @media (max-width:600px){
    .folha{padding:var(--e6) var(--e4) var(--e7)}
    .capa h1{font-size:var(--title1)}
    section>h2{font-size:var(--title3)}
    .resumo,.acao,.premissas{padding:var(--e4)}
  }
  /* Filhos de grid/flex precisam encolher, senão o conteúdo estoura a tela. */
  .folha,.resumo,.cartao,.acao,.premissas dt{min-width:0}

  @media print{
    @page{size:A4;margin:14mm}
    body{background:#fff}
    .acoes,.naoImprime{display:none !important}
    /* A folha volta a ser a página: sem fundo, sem contorno, sem canto. */
    .folha{max-width:none;padding:0;margin:0;background:none;border:none;border-radius:0}
    section{break-inside:avoid}
    /* Coluna única no papel: duas colunas de recomendação em A4 estreitam
       demais a linha de texto. */
    .acoes-lista{display:block}
    .acoes-lista .acao{margin-bottom:var(--e3)}
    .premissas dl{grid-template-columns:1fr auto}
    a{text-decoration:none;color:inherit}
  }
</style>
</head>
<body>

<div class="acoes naoImprime">
  <a href="index.html">← Voltar ao diagnóstico</a>
  <button class="destaque" onclick="window.print()">↓ Imprimir ou salvar em PDF</button>
</div>

<div class="folha" id="folha">
  <p style="text-align:center;color:var(--muted);padding:60px 0">Montando seu relatório…</p>
</div>

<script src="config.js"></script>
<script src="app-core.js"></script>
<script src="calculo.js"></script>
<script>
const brl0 = v => isFinite(v) ? v.toLocaleString('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:0,maximumFractionDigits:0}) : '—';
const pct  = v => isFinite(v) ? (v*100).toFixed(1).replace('.',',')+'%' : '—';
const esc  = AppCore.escapeHtml;

// O relatório lê as MESMAS chaves que o diagnóstico e usa o MESMO motor
// (calculo.js). Antes ele recebia um estado pré-calculado via sessionStorage:
// quando o formato mudou, a página continuou abrindo sem nenhum erro de
// JavaScript, mas imprimiu tabelas inteiras vazias e NaN. Ler da mesma fonte
// que o diagnóstico elimina essa classe de divergência silenciosa.
const integrador   = AppCore.safeParse('integrador', null);
const projeto      = AppCore.safeParse('projeto', null);
const despesas     = AppCore.safeParse('despesas', null);
const configCustos = AppCore.safeParse('configCustos', {});

function montarEstado() {
  const custo = k => {
    const doProjeto = projeto?.custos_diretos?.[k];
    if (doProjeto !== undefined) return AppCore.parseNum(doProjeto);
    return AppCore.parseNum(configCustos?.[k]?.taxa || 0);
  };
  return {
    kit: AppCore.parseNum(projeto?.custo_kit),
    ca: custo('ca'), inst: custo('inst'), proj: custo('proj'),
    homol: custo('homol'), art: custo('art'),
    ticket: AppCore.parseNum(projeto?.valor_venda),
    qtd: AppCore.parseNum(despesas?.projetosMes),
    comissao: AppCore.parseNum(despesas?.comissao?.valor),
    tributo:  AppCore.parseNum(despesas?.tributo?.valor),
    outras:   AppCore.parseNum(despesas?.outras || 0),
    despFixa: AppCore.parseNum(despesas?.despFixa),
    lucroAlvo: AppCore.parseNum(integrador?.lucro_alvo ?? 12),
    comissaoBase: despesas?.comissao?.base || 'total',
    tributoBase:  despesas?.tributo?.base  || 'servico',
  };
}

const ESTADOS = {
  saudavel:       { cor:'var(--verde)', corSuave:'var(--mint)', selo:'Seu preço cobre tudo e ainda sobra' },
  abaixo_da_meta: { cor:'var(--ambar)',  corSuave:'var(--mel)', selo:'Você lucra, mas abaixo da sua meta' },
  prejuizo:       { cor:'var(--telha)', corSuave:'#F7E4DE', selo:'Neste preço, a conta não fecha' },
};

const LOGO = '<svg width="111" height="36" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 705.17 229.3"><g><g><g><path fill="#40c1ac" d="M91.55,6.65l39.12,96.91c1.55,3.83,1.55,8.11,0,11.93l-39.12,96.91c-1.62,4.02-5.52,6.65-9.86,6.65h-31.56c-4.33,0-8.23-2.63-9.86-6.65L1.16,115.5c-1.55-3.83-1.55-8.11,0-11.93L40.28,6.65c1.62-4.02,5.52-6.65,9.86-6.65h31.56c4.33,0,8.23,2.63,9.86,6.65h0Z"/><path fill="#00b140" d="M158.13,0h-40.66l42.67,103.45c1.6,3.89,1.6,8.27,0,12.16l-42.67,103.45h40.66c4.33,0,8.23-2.63,9.86-6.65l39.92-98.9c1.03-2.55,1.03-5.41,0-7.96L167.99,6.65c-1.62-4.02-5.52-6.65-9.86-6.65Z"/></g><g><path fill="#00b140" d="M261.17,209.32l10.82-61.6h40.92l-1.94,10.82h-27.28l-2.64,15.14h23.67l-1.94,10.82h-23.67l-2.46,13.99h27.28l-1.85,10.82h-40.92Z"/><path fill="#00b140" d="M368.88,145.7l-11.18,63.62h-13.11l1.06-6.6c-4.05,4.66-8.89,7.57-15.49,7.57-13.73,0-20.06-10.56-17.78-23.76,2.2-12.67,11.79-23.32,25.87-23.32,6.07,0,10.82,2.99,13.2,7.13l4.31-24.64h13.11ZM334.83,199.64c6.42,0,12.5-4.14,13.9-12.32,1.5-8.36-2.64-13.46-9.77-13.46s-12.23,5.81-13.46,12.76c-1.32,7.22,2.11,13.02,9.33,13.02Z"/><path fill="#00b140" d="M411.74,209.32h-13.11l.97-6.16c-4.66,5.28-9.77,7.13-15.22,7.13-12.67,0-14.34-10.12-12.32-21.56l4.4-24.55h13.11l-4.31,24.29c-1.14,6.25.35,11,6.42,11s9.42-4.84,10.56-11.09l4.31-24.2h13.2l-8.01,45.14Z"/><path fill="#00b140" d="M453.63,163.21c4.66,0,10.65.97,17.34,6.69l-7.66,9.59c-3.78-3.96-8.89-4.49-11.18-4.49-7.66,0-13.55,4.84-14.87,11.7-1.14,6.86,3.08,11.7,10.74,11.7,2.29,0,7.57-.53,12.67-4.49l4.31,9.59c-8.8,5.72-15.05,6.69-19.71,6.69-15.49,0-23.41-10.12-21.12-23.5,2.38-13.38,13.99-23.5,29.48-23.5Z"/><path fill="#00b140" d="M525.7,164.18l-8.01,45.14h-13.11l1.06-6.6c-4.05,4.66-8.89,7.57-15.49,7.57-13.73,0-20.06-10.56-17.78-23.76,2.2-12.67,11.79-23.32,25.87-23.32,6.07,0,10.82,2.99,13.2,7.13l1.14-6.16h13.11ZM494.81,199.64c6.42,0,12.5-4.14,13.9-12.32,1.5-8.36-2.64-13.46-9.77-13.46s-12.23,5.81-13.46,12.76c-1.32,7.22,2.11,13.02,9.33,13.02Z"/><path fill="#00b140" d="M558.96,218.91c-1.41,8.18-9.33,10.38-13.82,10.38-6.86,0-10.65-4.49-12.06-9.86l7.22-3.08c1.06,3.78,3.08,4.66,4.75,4.66,2.73,0,4.58-1.5,5.02-4.31.44-2.55-.97-5.98-4.75-7.04-11.62-2.29-17.16-11.44-15.14-22.97,2.38-13.38,13.9-23.5,29.39-23.5,4.66,0,10.65.97,17.34,6.69l-7.66,9.59c-3.78-3.96-8.89-4.49-11.18-4.49-7.66,0-13.55,4.84-14.78,11.7s2.99,11.7,10.65,11.7c2.29,0,7.57-.53,12.67-4.49l3.7,9.59c-6.16,4.05-10.91,5.72-14.7,6.34,2.82,2.9,3.78,6.42,3.34,9.06Z"/><path fill="#00b140" d="M631.3,164.18l-8.01,45.14h-13.11l1.06-6.6c-4.05,4.66-8.89,7.57-15.49,7.57-13.73,0-20.06-10.56-17.78-23.76,2.2-12.67,11.79-23.32,25.87-23.32,6.07,0,10.82,2.99,13.2,7.13l1.14-6.16h13.11ZM600.41,199.64c6.42,0,12.5-4.14,13.9-12.32,1.5-8.36-2.64-13.46-9.77-13.46s-12.23,5.81-13.46,12.76c-1.32,7.22,2.11,13.02,9.33,13.02ZM615.72,157.05c-5.02,0-8.8-2.99-11.7-2.99-2.55,0-3.78,1.32-5.37,3.78l-6.25-1.94c2.99-6.51,6.25-10.74,11.97-10.74,5.02,0,8.8,2.99,11.7,2.99,2.55,0,3.78-1.32,5.37-3.78l6.25,1.94c-2.99,6.51-6.25,10.74-11.97,10.74Z"/><path fill="#00b140" d="M664.65,163.21c13.2,0,23.06,9.5,20.59,23.5-2.46,14.08-15.75,23.58-28.95,23.58s-23.14-9.42-20.68-23.58c2.46-14.08,15.93-23.5,29.04-23.5ZM658.23,199.02c6.51,0,12.94-5.28,14.26-12.32,1.32-6.95-3.26-12.23-9.77-12.23s-13.02,5.19-14.34,12.23c-1.32,7.13,3.43,12.32,9.86,12.32Z"/></g><g><path fill="#183029" d="M261.05,134.02V10.61h84.8v25.74h-53.6v24.51h46.55v24.33h-46.55v48.84h-31.2,0Z"/><path fill="#183029" d="M340.74,134.02l47.78-123.41h29.09l48.48,123.41h-32.79l-8.46-21.86h-43.72l-8.11,21.86h-32.27ZM387.81,87.12h29.97l-14.63-43.37-15.34,43.37Z"/><path fill="#183029" d="M455.69,10.61h33.32l24.68,81.98,24.68-81.98h33.32l-44.08,123.41h-28.03l-43.9-123.41h.01Z"/><path fill="#183029" d="M574.35,72.31c0-34.73,27.5-63.64,65.41-63.64s65.41,28.91,65.41,63.64-27.5,63.64-65.41,63.64-65.41-28.91-65.41-63.64ZM673.96,72.31c0-20.45-14.46-35.96-34.2-35.96s-34.03,15.51-34.03,35.96,14.28,35.97,34.03,35.97,34.2-15.52,34.2-35.97Z"/></g></g></g></svg>';

// ── Capa ───────────────────────────────────────────────────────────────
function capa() {
  const hoje = new Date().toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'});
  const dados = [
    ['Empresa', integrador?.nome_empresa],
    ['CNPJ', integrador?.cnpj],
    ['Regime', integrador?.regime_tributario || 'Não informado'],
    ['Projeto', projeto?.nome_projeto],
    ['Potência', projeto?.kwp_sistema ? projeto.kwp_sistema + ' kWp' : null],
    ['Módulos', projeto?.quantidade_modulos ? projeto.quantidade_modulos + ' un' : null],
  ].filter(x => x[1]);

  return `<header class="capa">
    <div class="capa-marca">${LOGO}
      <div class="brand-name">Auditor de Precificação</div>
    </div>
    <h1>Relatório de precificação</h1>
    <p class="quando">Gerado em ${esc(hoje)}${integrador?.email ? ' · ' + esc(integrador.email) : ''}</p>
    <div class="capa-dados">
      ${dados.map(x => `<div><div class="rot">${esc(x[0])}</div><div class="val">${esc(String(x[1]))}</div></div>`).join('')}
    </div>
  </header>`;
}

// ── 01 Resumo ──────────────────────────────────────────────────────────
function resumo(r) {
  const e = ESTADOS[r.situacao], a = r.atual, d = r.dados;

  // A cifra fica sozinha na linha, como no diagnóstico: junto com a frase
  // ela quebra em duas linhas e perde a força — e este é o número que o
  // leitor procura ao abrir o PDF.
  const numero = r.situacao === 'prejuizo'
    ? brl0(Math.abs(a.lucroMes))
    : brl0(a.lucroUnit);

  const legenda = r.situacao === 'prejuizo'
    ? 'faltam por mês'
    : 'sobram por projeto';

  const abaixo = r.situacao === 'prejuizo'
    ? 'É quanto o mês fecha no vermelho no preço de hoje.'
    : brl0(a.lucroMes) + ' por mês, somando os ' + d.qtd + ' projetos que você faz.';

  const piso = r.abaixoDoPiso
    ? `Para lucrar ${pct(d.lucroAlvo/100)} você precisaria cobrar no mínimo
       <b>${brl0(r.piso)}</b>. Hoje você cobra <b>${brl0(d.ticket)}</b>,
       então faltam <b>${brl0(r.piso - d.ticket)}</b> por projeto.`
    : `Seu <b>preço mínimo</b> para lucrar ${pct(d.lucroAlvo/100)} é <b>${brl0(r.piso)}</b>.
       Você cobra <b>${brl0(d.ticket)}</b>, ou seja <b>${brl0(r.folga)}</b> acima do mínimo.
       <span class="nota">Isso é folga de margem, não convite a dar desconto.</span>`;

  return `<section>
    <div class="sec-num">01</div>
    <h2>Resumo</h2>
    <div class="resumo" style="--cor:${e.cor};--corSuave:${e.corSuave}">
      <span class="selo">${esc(e.selo)}</span>
      <div class="numero">${esc(numero)}</div>
      <div class="legenda">${esc(legenda)}</div>
      <p>${esc(abaixo)} É o que fica com a empresa depois do kit, da instalação, do projeto,
      da comissão, do imposto e da fatia do mês em estrutura.</p>
      <div class="piso">${piso}</div>
    </div>
  </section>`;
}

// ── 02 Cascata ─────────────────────────────────────────────────────────
function cascata(r) {
  const d = r.dados, a = r.atual, tk = d.ticket;
  const linhas = [
    { nome:'Kit', sub:'faturado pela distribuidora', v:d.kit, c:'#A9AEB6' },
    { nome:'Instalação', sub:'mão de obra', v:d.inst, c:'#7E8B94' },
    { nome:'Projeto, ART e homologação', sub:'', v:d.proj + d.ca + d.homol + d.art, c:'#9AA7AE' },
    { nome:'Comissão do vendedor', sub:'', v:a.comissaoR, c:'#D9663B' },
    { nome:'Imposto', sub:d.tributoBase==='servico' ? 'sobre a parte de serviço' : 'sobre a venda total', v:a.tributoR, c:'#C4552C' },
    { nome:'Sua estrutura', sub:'a fatia do mês que cabe a este projeto', v:a.despFixaUnit, c:'#E08A5E' },
  ].filter(l => l.v > 0);
  if (a.outrasR > 0) linhas.push({ nome:'Outras despesas variáveis', sub:'', v:a.outrasR, c:'#D9663B' });

  const sobra = a.lucroUnit;
  const larg = v => tk > 0 ? Math.max(0, Math.min(100, Math.abs(v)/tk*100)) : 0;

  return `<section>
    <div class="sec-num">02</div>
    <h2>Para onde vai cada ${brl0(tk)} que entram</h2>
    <p class="intro">É o mesmo projeto, fatiado. A última linha é o que fica com a empresa.</p>
    <div class="rolagem"><table>
      <tbody>
        ${linhas.map(l => `<tr>
          <td>${esc(l.nome)}${l.sub?`<small>${esc(l.sub)}</small>`:''}
            <div class="barra"><i style="width:${larg(l.v)}%;background:${l.c}"></i></div></td>
          <td>${brl0(l.v)}</td>
          <td class="mudo">${pct(l.v/tk)}</td>
        </tr>`).join('')}
        <tr class="total">
          <td>${sobra>=0?'Sobra pra você':'Falta'}
            <div class="barra"><i style="width:${larg(sobra)}%;background:${sobra>=0?'var(--positive)':'var(--negative)'}"></i></div></td>
          <td class="${sobra>=0?'pos':'neg'}">${brl0(sobra)}</td>
          <td class="${sobra>=0?'pos':'neg'}">${pct(sobra/tk)}</td>
        </tr>
      </tbody>
    </table></div>
  </section>`;
}

// ── 03 O ano ───────────────────────────────────────────────────────────
function anual(r) {
  const an = r.anual, a = r.atual, pe = r.pontoEquilibrio;

  // Margem de contribuição negativa: cada venda já sai no prejuízo, então
  // nenhum volume paga as contas. Dizer isso é mais útil do que imprimir "—".
  const semEquilibrio = !isFinite(pe) || pe <= 0;
  const peTexto = semEquilibrio ? 'Nenhum'
    : pe < 1 ? 'menos de 1' : pe < 2 ? 'pouco mais de 1' : pe.toFixed(1).replace('.',',');
  const peObs = semEquilibrio
    ? `cada venda perde ${brl0(Math.abs(a.mcUnit))} antes mesmo da estrutura, então vender mais aumenta o prejuízo`
    : `por mês, só para não ter prejuízo. Você vende ${r.dados.qtd}`;

  return `<section>
    <div class="sec-num">03</div>
    <h2>Seu ano, no preço de hoje</h2>
    <p class="intro">Projeção de 12 meses mantendo o preço e o volume que você informou.</p>
    <div class="cartoes">
      <div class="cartao" style="--c:var(--teal)">
        <div class="rot">Faturamento no ano</div>
        <div class="val">${brl0(an.faturamento)}</div>
        <div class="obs">${an.projetos} projetos ao longo de 12 meses</div>
      </div>
      <div class="cartao" style="--c:${an.sobra>=0?'var(--positive)':'var(--negative)'}">
        <div class="rot">${an.sobra>=0?'Sobra no ano':'Prejuízo no ano'}</div>
        <div class="val" style="color:${an.sobra>=0?'var(--positive)':'var(--negative)'}">${brl0(an.sobra)}</div>
        <div class="obs">${pct(a.lucroPct)} de cada venda</div>
      </div>
      <div class="cartao" style="--c:var(--teal)">
        <div class="rot">Projetos para pagar as contas</div>
        <div class="val" style="color:${semEquilibrio?'var(--negative)':'var(--ink)'}">${esc(peTexto)}</div>
        <div class="obs">${esc(peObs)}</div>
      </div>
    </div>
  </section>`;
}

// ── 04 Custo do desconto ───────────────────────────────────────────────
function desconto(r) {
  const a = r.atual;
  if (a.lucroMes <= 0) return '';

  const l2 = r.descontos.find(l => l.desconto === 2);
  const mult = l2 && l2.multiplicador;
  const chamada = mult
    ? `Cada 1% de desconto tira cerca de <b>${brl0(a.lucroMes*0.01*mult)}</b> do seu lucro no mês,
       <b>${mult.toFixed(1).replace('.',',')} vezes</b> o que você deu de desconto.`
    : '';

  return `<section>
    <div class="sec-num">04</div>
    <h2>Quanto custa cada desconto</h2>
    <p class="intro">O desconto sai inteiro da sua margem, então some do lucro num múltiplo do que foi dado no preço. ${chamada}</p>
    <div class="rolagem"><table>
      <thead><tr><th>Desconto</th><th>Preço</th><th>Sobra no mês</th><th>Sobra no ano</th><th>Deixa de ganhar</th></tr></thead>
      <tbody>
        ${r.descontos.map(l => `<tr class="${l.desconto===0?'destaque':''}">
          <td>${l.desconto===0?'<b>Preço de hoje</b>':'−'+l.desconto+'%'}</td>
          <td>${brl0(l.preco)}</td>
          <td>${brl0(l.lucroMes)}</td>
          <td>${brl0(l.lucroMes*12)}</td>
          <td class="${l.perdaMes>0?'neg':'mudo'}">${l.perdaMes>0?'− '+brl0(l.perdaMes*12):'—'}</td>
        </tr>`).join('')}
      </tbody>
    </table></div>
  </section>`;
}

// ── 05 O que fazer ─────────────────────────────────────────────────────
// As recomendações mudam conforme a situação. Quem já está acima do piso NÃO
// recebe "reajuste o preço": recebe como proteger a margem que já tem. A versão
// anterior deste relatório recomendava, com selo de "RECOMENDADO", um corte de
// 14,9% no preço de uma empresa lucrativa.
function acoes(r) {
  const d = r.dados, a = r.atual;
  const itens = [];

  if (r.situacao === 'saudavel') {
    itens.push({
      tag:'Proteger', cor:'var(--verde)', corSuave:'var(--mint)',
      titulo:'Segure o preço, essa folga é sua margem',
      texto:`Você cobra <b>${brl0(d.ticket)}</b> e seu piso é <b>${brl0(r.piso)}</b>.
        A diferença de <b>${brl0(r.folga)}</b> por projeto é o que cobre imprevisto, atraso de obra
        e o próprio crescimento. Tratar isso como espaço para desconto é abrir mão de
        <b>${brl0(r.folga * d.qtd * 12)}</b> por ano.`
    });
    itens.push({
      tag:'Disciplina', cor:'var(--teal-marca)', corSuave:'var(--mint)',
      titulo:'Dê à equipe um limite claro de desconto',
      texto:`Abaixo de <b>${brl0(r.piso)}</b> a venda deixa de entregar sua meta de ${pct(d.lucroAlvo/100)}.
        Esse é o número que o vendedor precisa conhecer, não o preço de tabela.`
    });
  }

  if (r.situacao === 'abaixo_da_meta' || r.situacao === 'prejuizo') {
    const falta = r.piso - d.ticket;
    itens.push({
      tag:'Opção A', cor:'var(--ambar)', corSuave:'var(--mel)',
      titulo:'Ajustar o preço',
      texto:`Levar o preço de <b>${brl0(d.ticket)}</b> para <b>${brl0(r.piso)}</b>
        (reajuste de <b>${pct(falta/d.ticket)}</b>) entrega sua meta de ${pct(d.lucroAlvo/100)}
        mantendo o mesmo volume.`,
      texto2:'Aplique em propostas novas, não em contratos em andamento, e acompanhe a conversão nas primeiras semanas.'
    });

    if (r.custoMaximo != null && r.custoMaximo < d.cdt) {
      const corte = d.cdt - r.custoMaximo;
      itens.push({
        tag:'Opção B', cor:'var(--ambar)', corSuave:'var(--mel)',
        titulo:'Reduzir o custo do projeto, sem mexer no preço',
        texto:`Seu custo direto é <b>${brl0(d.cdt)}</b> por projeto. Para atingir a mesma meta
          cobrando os mesmos <b>${brl0(d.ticket)}</b>, ele precisaria cair para <b>${brl0(r.custoMaximo)}</b>,
          uma economia de <b>${brl0(corte)}</b> por projeto (${pct(corte/d.cdt)}).`,
        texto2:'Costuma ser mais fácil negociar kit e instalação do que repassar reajuste ao cliente.'
      });
    }

    itens.push({
      tag:'Opção C', cor:'var(--ambar)', corSuave:'var(--mel)',
      titulo:'Diluir a estrutura em mais projetos',
      texto:`Sua estrutura custa <b>${brl0(a.despFixaMes)}</b> por mês, hoje dividida por
        <b>${d.qtd}</b> projetos, ou seja <b>${brl0(a.despFixaUnit)}</b> em cada um. Vender mais sem aumentar
        essa estrutura reduz esse peso e melhora a margem de todos os projetos.`
    });
  }

  if (!itens.length) return '';

  return `<section>
    <div class="sec-num">05</div>
    <h2>O que fazer com isso</h2>
    <p class="intro">Caminhos possíveis a partir dos seus próprios números.</p>
    <div class="acoes-lista">${itens.map(i => `<div class="acao" style="--cor:${i.cor};--corSuave:${i.corSuave}">
      <span class="tag">${esc(i.tag)}</span>
      <h3>${esc(i.titulo)}</h3>
      <p>${i.texto}</p>
      ${i.texto2?`<p>${esc(i.texto2)}</p>`:''}
    </div>`).join('')}</div>
  </section>`;
}

// ── 06 Premissas ───────────────────────────────────────────────────────
function premissas(r) {
  const d = r.dados;
  const informou = [
    ['Preço praticado hoje', brl0(d.ticket)],
    ['Projetos por mês', d.qtd],
    ['Custo do kit', brl0(d.kit)],
    ['Instalação', brl0(d.inst)],
    ['Projeto e documentação', brl0(d.proj)],
    ['Comissão de vendas', pct(d.comissao/100)],
    ['Imposto sobre a venda', pct(d.tributo/100)],
    ['Despesa fixa mensal', brl0(d.despFixa)],
    ['Margem desejada', pct(d.lucroAlvo/100)],
  ];
  const assumiu = [
    d.tributoBase === 'servico'
      ? 'O kit é faturado pela distribuidora direto ao cliente, então o imposto incide só sobre a sua parte de serviço.'
      : 'A nota do kit sai no seu CNPJ, então o imposto incide sobre o valor cheio da venda.',
    d.comissaoBase === 'total'
      ? 'A comissão é calculada sobre o valor cheio da venda.'
      : 'A comissão é calculada só sobre a parte de serviço.',
    'Você vende ' + d.qtd + ' projetos parecidos com este todo mês, o ano inteiro.',
    'Não há outras despesas variáveis além de comissão e imposto.',
  ];

  let ressalva = 'Este é um diagnóstico gerencial, não uma consultoria contábil ou tributária. '
    + 'Usamos o percentual de imposto que você informou. Sua alíquota real varia conforme o regime, '
    + 'o faturamento dos últimos 12 meses e o ISS do seu município. Confirme com seu contador antes de mudar preços.';
  const reg = integrador?.regime_tributario;
  if (reg === 'Lucro Presumido' || reg === 'Lucro Real') {
    ressalva += ' Como sua empresa é ' + reg + ', o valor que sobra ainda é antes de IRPJ e CSLL.';
  }

  return `<section>
    <div class="sec-num">06</div>
    <h2>Como chegamos nesses números</h2>
    <div class="premissas">
      <p style="font-size:13px;font-weight:700;margin:0 0 12px">Você informou</p>
      <dl>${informou.map(x => `<dt>${esc(x[0])}</dt><dd>${esc(String(x[1]))}</dd>`).join('')}</dl>
      <p style="font-size:13px;font-weight:700;margin:0 0 10px">A gente assumiu</p>
      <ul>${assumiu.map(t => `<li>${esc(t)}</li>`).join('')}</ul>
      <p class="ressalva">${esc(ressalva)}</p>
    </div>
  </section>`;
}

function rodape() {
  const link = (AppConfig.ctaWhatsapp || '').trim();
  const cta = link
    ? `<p class="naoImprime" style="text-align:center;margin-bottom:22px">
         <a href="${esc(link)}" target="_blank" rel="noopener"
            style="display:inline-flex;background:var(--solar);color:#fff;border-radius:10px;padding:15px 28px;
                   font-weight:700;text-decoration:none;font-size:15px">Quero conversar sobre esses números</a></p>`
    : '';
  return cta + `<p class="rodape">Relatório gerado pelo Auditor de Precificação · FAVO Educação<br>
    Os números refletem as informações fornecidas por ${esc(integrador?.nome_empresa || 'você')}.</p>`;
}

// ── Boot ───────────────────────────────────────────────────────────────
function init() {
  if (!integrador?.nome_empresa || !projeto?.valor_venda || !despesas?.projetosMes) {
    window.location.href = 'index.html';
    return;
  }
  const r = Calculo.diagnostico(montarEstado());

  if (!r.valido) {
    document.getElementById('folha').innerHTML = capa() + `<section>
      <h2>Não foi possível montar o relatório</h2>
      <p class="intro">Com os números informados não existe preço que entregue a margem desejada:
      comissão, impostos e margem somam 100% ou mais.</p>
      <p><a href="custos.html">← Revisar meus números</a></p></section>`;
    return;
  }

  document.getElementById('folha').innerHTML =
    capa() + resumo(r) + cascata(r) + anual(r) + desconto(r) + acoes(r) + premissas(r) + rodape();
}

init();
</script>
</body>
</html>

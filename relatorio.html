<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relatório de Diagnóstico · Auditor de Precificação</title>
<style>
  :root{
    --bg:#F2F9F5;--surface:#FFFFFF;--ink:#1B1A16;--muted:#736F64;--hair:#DFF0E8;
    --solar:#00B140;--teal:#183029;--positive:#00B140;--negative:#B23A2E;
    --teal-accent:#40C1AC;
    --mono:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}

  .report{max-width:820px;margin:0 auto;padding:28px 22px;display:flex;flex-direction:column;gap:20px}

  /* Ações (ocultas na impressão) */
  .rpt-actions{display:flex;gap:8px}
  .btn-back{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--muted);padding:8px 12px;background:var(--surface);border:1px solid var(--hair);border-radius:8px;cursor:pointer;font-family:var(--sans);text-decoration:none}
  .btn-back:hover{color:var(--ink)}
  .btn-print{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;color:#fff;padding:8px 16px;background:var(--solar);border:none;border-radius:8px;cursor:pointer;font-family:var(--sans)}
  .btn-print:hover{opacity:.9}

  /* Cabeçalho do relatório */
  .rpt-header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding-bottom:18px;border-bottom:2px solid var(--teal)}
  .rpt-brand{display:flex;align-items:center;gap:10px}
  .rpt-brand-name{font-size:13px;font-weight:700;color:var(--ink);letter-spacing:.3px}
  .rpt-brand-sub{font-size:10px;color:var(--teal-accent);font-family:var(--mono);letter-spacing:1px;text-transform:uppercase;font-weight:700}
  .rpt-meta{text-align:right;font-size:11px;color:var(--muted);line-height:1.8}
  .rpt-meta strong{display:block;font-size:14px;font-weight:800;color:var(--ink);letter-spacing:-.2px}

  /* Seção */
  .sec{background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:22px}
  .sec-title{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:1.4px;color:var(--muted);margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid var(--hair)}

  /* Identificação */
  .capa-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .capa-item .lbl{font-size:9px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-bottom:3px}
  .capa-item .val{font-size:14px;font-weight:700}

  /* Veredito */
  .veredito{text-align:center;padding:6px 0 18px}
  .v-badge{display:inline-block;font-size:12px;font-weight:700;padding:5px 18px;border-radius:20px;margin-bottom:14px;letter-spacing:.4px}
  .v-badge.ok{background:#E9F7EF;color:var(--positive)}
  .v-badge.bad{background:#FDECEA;color:var(--negative)}
  .v-precos{display:flex;align-items:center;gap:22px;justify-content:center;margin-bottom:12px}
  .v-col{text-align:center}
  .v-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:4px}
  .v-price{font-family:var(--mono);font-size:30px;font-weight:800;line-height:1}
  .v-arrow{font-size:22px;color:var(--muted);padding:0 4px}
  .v-msg{font-size:13px;color:var(--muted);line-height:1.5;text-align:justify}
  .v-sub{font-size:12px;color:var(--teal);background:#E9F7EF;border:1px solid #B7E5C9;border-radius:8px;padding:9px 14px;margin-top:8px;line-height:1.6;text-align:justify}

  /* KPIs */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}
  .kpi{border:1px solid var(--hair);border-radius:10px;padding:14px;border-top:3px solid currentColor}
  .kpi .k{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:7px;font-weight:700}
  .kpi .v{font-family:var(--mono);font-size:20px;font-weight:700;line-height:1}
  .kpi .s{font-size:11px;color:var(--muted);margin-top:5px}

  /* Tabela comparativa */
  .cmp-wrap{overflow-x:auto}
  .cmp-table{width:100%;border-collapse:collapse;font-size:13px}
  .cmp-table th{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);padding:0 12px 12px;text-align:right;white-space:nowrap}
  .cmp-table th:first-child{text-align:left;padding-left:0;width:38%}
  .cmp-table td{padding:9px 12px;border-top:1px solid var(--hair);font-family:var(--mono);font-size:13px;text-align:right;vertical-align:middle}
  .cmp-table td:first-child{font-family:var(--sans);font-size:12px;color:var(--muted);text-align:left;padding-left:0;font-family:var(--sans)}
  .cmp-table .fw{font-weight:800;color:var(--ink)}
  .cmp-table .sug-col{background:#F0FAF5}
  .cmp-table .pos{color:var(--positive)}
  .cmp-table .neg{color:var(--negative)}
  .cmp-table .mu{color:var(--muted)}
  .cmp-badge{display:inline-block;font-size:8px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;padding:2px 7px;border-radius:8px;margin-top:5px;white-space:nowrap}
  .cmp-badge.green{background:#E9F7EF;color:var(--positive)}
  .cmp-badge.orange{background:#FFF3E0;color:#C05A00}
  .cmp-table th.sug-th{background:#F0FAF5;border-top:3px solid var(--positive)}

  /* Cards narrativos */
  .narr-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .narr-card{background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:10px;break-inside:avoid;page-break-inside:avoid}
  .narr-card.rec{border:2px solid var(--positive)}
  .narr-card.alerta{border-color:#D9663B}
  .narr-card.inviavel{border-color:var(--negative)}
  .narr-badge{display:inline-block;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;padding:3px 9px;border-radius:10px}
  .narr-badge.green{background:#E9F7EF;color:var(--positive)}
  .narr-badge.orange{background:#FFF3E0;color:#C05A00}
  .narr-badge.red{background:#FDECEA;color:var(--negative)}
  .narr-title{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
  .narr-number{font-family:var(--mono);font-size:26px;font-weight:800;line-height:1.1}
  .narr-sub{font-size:11px;color:var(--muted);text-align:justify}
  .narr-text{font-size:12px;color:var(--muted);line-height:1.6;flex:1;text-align:justify}
  .narr-sep{height:1px;background:var(--hair);margin:2px 0}
  .narr-meta{font-size:11px;color:var(--muted)}
  @media(max-width:640px){.narr-grid{grid-template-columns:1fr}}

  /* Gráfico */
  .chart-wrap{overflow-x:auto;margin-bottom:12px}
  .chart-legend{display:flex;gap:18px;font-size:12px;flex-wrap:wrap;color:var(--muted)}
  .leg-item{display:flex;align-items:center;gap:7px}
  .leg-line{width:22px;height:3px;border-radius:2px;flex-shrink:0}
  .leg-dot{width:10px;height:10px;border-radius:50%;border:2px solid #fff;flex-shrink:0}

  /* Premissas */
  .prem-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .prem-item .k{font-size:9px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-bottom:3px}
  .prem-item .v{font-size:13px;font-weight:700}

  /* Rodapé */
  .rpt-footer{text-align:center;font-size:11px;color:var(--muted);border-top:1px solid var(--hair);padding-top:14px}

  /* Loading */
  #loading{display:flex;align-items:center;justify-content:center;min-height:70vh;flex-direction:column;gap:12px;color:var(--muted);font-size:14px}

  @media (max-width:640px){
    .kpis{grid-template-columns:1fr 1fr}
    .capa-grid{grid-template-columns:1fr 1fr}
    .prem-grid{grid-template-columns:1fr 1fr}
    .opt-grid{grid-template-columns:1fr}
    .elast-block{flex-direction:column}
  }

  /* P4 — KPI tip */
  .kpi-tip{font-size:10px;color:var(--muted);font-style:italic;margin-top:8px;line-height:1.5;text-align:justify}
  .kpi .s{text-align:justify}

  /* P1 — Lucro adicional */
  .narr-delta{background:#E9F7EF;border-radius:8px;padding:10px 12px;margin:4px 0;text-align:justify}
  .narr-delta-num{font-family:var(--mono);font-size:20px;font-weight:800;color:var(--positive);display:block;line-height:1.1;margin-bottom:3px}

  /* P2 — Elasticidade */
  .elast-block{background:#F0FAF5;border:1px solid #B7E5C9;border-radius:12px;padding:16px 18px;display:flex;gap:14px;align-items:flex-start;margin-top:12px}
  .elast-icon{font-size:14px;font-weight:900;color:var(--teal);flex-shrink:0;width:28px;height:28px;background:#C6E9D6;border-radius:50%;display:flex;align-items:center;justify-content:center}
  .elast-title{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--teal);margin-bottom:6px}
  .elast-body{font-size:12px;color:var(--teal);line-height:1.7;text-align:justify}
  .elast-alert{color:var(--negative);font-weight:700}

  /* P5 — Recomendações */
  .rec-intro{font-size:13px;color:var(--muted);margin-bottom:16px;line-height:1.6;text-align:justify}
  .opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
  .opt-card{border:1px solid var(--hair);border-radius:10px;padding:16px}
  .opt-a{border-top:3px solid var(--teal)}
  .opt-b{border-top:3px solid var(--teal-accent)}
  .opt-label{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:4px}
  .opt-title{font-size:13px;font-weight:700;margin-bottom:8px}
  .opt-text{font-size:12px;color:var(--muted);line-height:1.6;text-align:justify}
  .opt-nota{font-size:11px;color:var(--negative);margin-top:8px;font-style:italic;line-height:1.5;text-align:justify}
  .impl-block{border:1px solid var(--hair);border-radius:10px;padding:14px 16px;margin-bottom:16px;background:#FAFCFB}
  .impl-title{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:8px}
  .impl-list{margin:0 0 0 18px;padding:0}
  .impl-list li{font-size:12px;color:var(--muted);margin-bottom:5px;line-height:1.5;text-align:justify}
  .cta-row{display:flex;gap:10px;flex-wrap:wrap;padding-top:4px}
  .cta-btn-primary{display:inline-flex;align-items:center;padding:10px 20px;background:var(--solar);color:#fff;border-radius:9px;font-size:13px;font-weight:700;text-decoration:none;font-family:var(--sans)}
  .cta-btn-primary:hover{opacity:.9}
  .cta-btn-secondary{display:inline-flex;align-items:center;padding:10px 18px;background:var(--surface);color:var(--teal);border:1px solid var(--teal);border-radius:9px;font-size:13px;font-weight:600;text-decoration:none;font-family:var(--sans)}
  .cta-btn-secondary:hover{background:#E9F7EF}

  @media print{
    .rpt-actions{display:none!important}
    body{background:#fff}
    .report{padding:8px}
    .sec{border-radius:6px;break-inside:avoid;page-break-inside:avoid}
    .chart-wrap svg{max-width:100%}
    @page{size:A4;margin:14mm 12mm}
  }
</style>
</head>
<body>

<div id="loading">
  <svg viewBox="0 0 509 534" width="36" height="36" xmlns="http://www.w3.org/2000/svg">
    <path fill="#40C1AC" d="M223,16L318,252c4,9,4,20,0,29L223,518c-4,10-13,16-24,16h-77c-11,0-20-6-24-16L3,282c-4-9-4-20,0-29L98,16C102,6,112,0,122,0h77C210,0,219,6,223,16z"/>
    <path fill="#00B140" d="M386,0h-99l104,252c4,10,4,20,0,30L287,534h99c11,0,20-6,24-16l97-241c3-6,3-13,0-19L410,16C406,6,397,0,386,0z"/>
  </svg>
  <span>Carregando relatório…</span>
</div>

<div id="report" class="report" style="display:none"></div>

<script src="js/cenarios.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const { createClient } = supabase;
const db = createClient(
  'https://dfsmwzmtainiclcwpigw.supabase.co',
  'sb_publishable_trZuSsmSkPKN9Ry0WytyUg_xn7UYBo3'
);

const brl   = v => isFinite(v) ? v.toLocaleString('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:2}) : '—';
const pct   = v => isFinite(v) ? (v*100).toFixed(1).replace('.',',')+' %' : '—';
const num1  = v => isFinite(v) ? v.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1}) : '—';
const num0  = v => isFinite(v) ? Math.round(v).toLocaleString('pt-BR') : '—';

const MESES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

const CTA_URL_ANALISE  = 'index.html';
const CTA_URL_CONTEUDO = 'https://grupofavo.com/consultoria';

(async () => {
  // 1. Auth
  const { data: { session } } = await db.auth.getSession();
  if (!session?.user) { window.location.href = 'login.html?returnTo=relatorio.html'; return; }
  const authUser = session.user;

  // 2. Estado salvo por abrirRelatorio() no index.html
  let state;
  try { state = JSON.parse(sessionStorage.getItem('relatorioState') || 'null'); } catch(e) {}
  if (!state?.lastCalc) { window.location.href = 'index.html'; return; }

  const { lastCalc, comissaoBase, tributoBase, despesasExtras, V12, meses } = state;
  const { d, precoSugerido } = lastCalc;

  // 3. Cenários anuais
  const result = calcCenarios({ d, precoSugerido, V12, meses, comissaoBase, tributoBase, despesasExtras });

  // 4. Dados de contexto
  const integrador = JSON.parse(localStorage.getItem('integrador') || 'null');
  const projeto    = JSON.parse(localStorage.getItem('projeto')    || 'null');

  // 5. Renderizar
  renderRelatorio(result, d, precoSugerido, integrador, projeto, authUser, comissaoBase, tributoBase, V12, despesasExtras);

  // 6. Persistir (assíncrono, não bloqueia)
  salvarSnapshot(result, d, integrador, projeto, authUser, comissaoBase, tributoBase);
})();

// ─────────────────────────────────────────────────────────────────────

function renderRelatorio(result, d, precoSugerido, integ, proj, authUser, cbBase, tbBase, V12, extras) {
  document.getElementById('report').innerHTML = [
    secAcoes(),
    secHeader(integ, proj, authUser),
    secIdentificacao(integ, proj),
    secDiagnostico(result, d, precoSugerido, V12),
    secNarrativa(result, d, precoSugerido, V12),
    secComparativa(result, d),
    secChart(result),
    secPremissas(d, cbBase, tbBase, V12, extras),
    secRecomendacoes(result, d, precoSugerido, V12),
    secFooter(authUser),
  ].join('');

  document.getElementById('loading').style.display = 'none';
  document.getElementById('report').style.display  = '';
}

// ── Seção 0: Ações ────────────────────────────────────────────────────
function secAcoes() {
  return `<div class="rpt-actions">
    <a class="btn-back" href="index.html">← Voltar à análise</a>
    <button class="btn-print" onclick="window.print()">↓ Imprimir / Baixar PDF</button>
  </div>`;
}

// ── Cabeçalho do relatório ────────────────────────────────────────────
function secHeader(integ, proj, authUser) {
  const data = new Date().toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'});
  return `<div class="rpt-header">
    <div class="rpt-brand">
      <svg viewBox="0 0 509 534" width="30" height="30" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0">
        <path fill="#40C1AC" d="M223,16L318,252c4,9,4,20,0,29L223,518c-4,10-13,16-24,16h-77c-11,0-20-6-24-16L3,282c-4-9-4-20,0-29L98,16C102,6,112,0,122,0h77C210,0,219,6,223,16z"/>
        <path fill="#00B140" d="M386,0h-99l104,252c4,10,4,20,0,30L287,534h99c11,0,20-6,24-16l97-241c3-6,3-13,0-19L410,16C406,6,397,0,386,0z"/>
      </svg>
      <div style="margin-left:8px">
        <div class="rpt-brand-name">Auditor de Precificação</div>
        <div class="rpt-brand-sub">FAVO Educação</div>
      </div>
    </div>
    <div class="rpt-meta">
      <strong>Relatório de Diagnóstico</strong>
      ${data}<br>${authUser.email}
    </div>
  </div>`;
}

// ── Seção 1: Identificação ────────────────────────────────────────────
function secIdentificacao(integ, proj) {
  const items = [
    {k:'Empresa',  v: integ?.nome_empresa        || '—'},
    {k:'Regime',   v: integ?.regime_tributario    || '—'},
    {k:'Projeto',  v: proj?.nome_projeto          || '—'},
    {k:'Potência', v: proj?.kwp_sistema           ? proj.kwp_sistema+' kWp'    : '—'},
    {k:'Módulos',  v: proj?.quantidade_modulos    ? proj.quantidade_modulos+' un' : '—'},
    {k:'Custo KIT',v: proj?.custo_kit             ? brl(proj.custo_kit)         : '—'},
  ];
  return `<div class="sec">
    <div class="sec-title">Identificação</div>
    <div class="capa-grid">
      ${items.map(i=>`<div class="capa-item"><div class="lbl">${i.k}</div><div class="val">${i.v}</div></div>`).join('')}
    </div>
  </div>`;
}

// ── Seção 2: Diagnóstico (veredito + KPIs) ───────────────────────────
function secDiagnostico(result, d, precoSugerido, V12) {
  const { atual } = result;
  const valido   = isFinite(precoSugerido) && precoSugerido > 0;
  const isAbaixo = valido && (precoSugerido - d.ticket) > 50;

  const badge = valido
    ? (isAbaixo
        ? '<span class="v-badge bad">Preço abaixo do ideal</span>'
        : '<span class="v-badge ok">Precificação saudável</span>')
    : '<span class="v-badge bad">Parâmetros insuficientes</span>';

  const priceColor = isAbaixo ? 'var(--negative)' : 'var(--positive)';
  const msg = valido
    ? (isAbaixo
        ? `Preço atual está <strong>${brl(precoSugerido - d.ticket)}</strong> abaixo do mínimo para ${d.lucroAlvo}% de lucro.`
        : `Preço atual está <strong>${brl(d.ticket - precoSugerido)}</strong> acima do mínimo para ${d.lucroAlvo}% de lucro.`)
    : 'Ajuste os parâmetros na tela de análise para gerar o preço sugerido.';

  const veredito = `<div class="veredito">
    ${badge}
    <div class="v-precos">
      <div class="v-col">
        <div class="v-lbl">Preço atual</div>
        <div class="v-price" style="color:${priceColor}">${brl(d.ticket)}</div>
      </div>
      <div class="v-arrow">→</div>
      <div class="v-col">
        <div class="v-lbl">Preço sugerido</div>
        <div class="v-price" style="color:var(--positive)">${valido ? brl(precoSugerido) : '—'}</div>
      </div>
    </div>
    <p class="v-msg">${msg}</p>
    ${valido && isAbaixo ? `<p class="v-sub">Ao aumentar seu ticket médio em <strong>${brl(precoSugerido - d.ticket)}</strong>, você atinge a meta de <strong>${d.lucroAlvo}%</strong> de lucro sem precisar aumentar sua equipe de vendas ou o volume de instalações.</p>` : ''}
  </div>`;

  const lucrativo = atual.lucroAnual >= 0;
  const mcUnitAtual = atual.mcPct * atual.ticket;
  const kpis = [
    {k:'Faturamento anual',      v:brl(atual.fatAnual),  s:`${num0(Math.ceil(V12))} projetos apurados anualmente`, c:'var(--ink)'},
    {k:'Margem de contribuição', v:pct(atual.mcPct),     s:brl(atual.mcAnual)+' no ano',
     tip:`De cada venda, sobram <strong>${brl(mcUnitAtual)}</strong> para cobrir as despesas fixas. Só depois disso começa o lucro.`,
     c:'var(--positive)'},
    {k:lucrativo?'Lucro anual':'Prejuízo anual',
     v:brl(Math.abs(atual.lucroAnual)),                  s:pct(atual.lucroPct)+' do faturamento',
     tip:'Projetado em cima das despesas apuradas nas etapas anteriores.',
     c:lucrativo?'var(--positive)':'var(--negative)'},
    {k:'Equilíbrio financeiro',
     v:atual.mePE ? MESES[atual.mePE-1] : 'Não atingido',
     s: atual.mePE
       ? `A partir de ${MESES[atual.mePE-1]}, as vendas acumuladas já cobriram todas as despesas fixas do ano. Tudo que entra depois vira lucro.`
       : 'A margem de contribuição acumulada não cobre as despesas fixas do ano.',
     c:atual.mePE?'var(--teal)':'var(--muted)'},
  ];

  const kpisHtml = `<div class="kpis">
    ${kpis.map(x=>`<div class="kpi" style="color:${x.c}">
      <div class="k">${x.k}</div>
      <div class="v">${x.v}</div>
      <div class="s">${x.s}</div>
      ${x.tip?`<div class="kpi-tip">${x.tip}</div>`:''}
    </div>`).join('')}
  </div>`;

  return `<div class="sec">${veredito}${kpisHtml}</div>`;
}

// ── Seção 3: Projeção comparativa ─────────────────────────────────────
function secComparativa(result, d) {
  const { atual, sugerido, necessario, FixasAno } = result;

  const cols = [
    {h:'Atual',      sub:`${num0(Math.ceil(atual.totalProj))} proj/ano ao preço atual`,              sc:atual},
    {h:'Sugerido',   sub:sugerido  ?`${num0(Math.ceil(sugerido.totalProj))} proj/ano com preço ajustado`:'',  sc:sugerido},
    {h:'Necessário', sub:necessario?`${num0(Math.ceil(necessario.VnecProj||0))} proj/ano ao preço atual`:'',  sc:necessario},
  ];

  const rows = [
    {lbl:'Preço de venda',         fn:sc=>brl(sc.ticket)},
    {lbl:'Volume anual',           fn:sc=>num0(sc.nome==='necessario'&&sc.VnecProj?Math.ceil(sc.VnecProj):Math.ceil(sc.totalProj))+' proj'},
    {lbl:'Faturamento anual',      fn:sc=>brl(sc.fatAnual),   fw:true},
    {lbl:'MC anual',               fn:sc=>brl(sc.mcAnual)},
    {lbl:'Margem de contribuição', fn:sc=>pct(sc.mcPct)},
    {lbl:'Despesas fixas anuais',  fn:()=>brl(FixasAno)},
    {lbl:'Lucro anual',            fn:sc=>brl(sc.lucroAnual), fw:true,
     cls:sc=>sc.lucroAnual>=0?'pos':'neg'},
    {lbl:'Lucro %',                fn:sc=>pct(sc.lucroPct),
     cls:sc=>sc.lucroPct>=0?'pos':'neg'},
    {lbl:'Mês de equilíbrio',      fn:sc=>sc.mePE?MESES[sc.mePE-1]+' (mês '+sc.mePE+')':'—'},
    {lbl:'Depende de crescimento?',
     fn: sc => sc.nome==='necessario'&&pctVolNec!==null
       ? `Sim <em style="font-size:10px;color:var(--muted)">(+${pctVolNec}%)</em>`
       : '<span style="color:var(--positive)">Não</span>'},
  ];

  const pctVolNec = necessario ? Math.round((necessario.VnecProj / atual.totalProj - 1) * 100) : null;
  const cmpBadge = {
    'Sugerido':   `<div><span class="cmp-badge green">Menor Esforço / Maior Retorno</span></div>`,
    'Necessário': `<div><span class="cmp-badge orange">Depende de Crescimento</span></div>`,
  };
  const head = `<tr><th></th>${cols.map(c=>`<th${c.h==='Sugerido'?' class="sug-th"':''}>
    ${c.h}<div style="font-size:9px;font-weight:400;color:var(--muted);margin-top:2px;white-space:normal">${c.sub}</div>
    ${cmpBadge[c.h]||''}
  </th>`).join('')}</tr>`;

  const body = rows.map(r=>`<tr>
    <td>${r.lbl}</td>
    ${cols.map(c=>{
      if(!c.sc) return '<td class="mu">—</td>';
      const val=r.fn(c.sc);
      const extra=(r.cls?r.cls(c.sc):'')+(r.fw?' fw':'')+(c.h==='Sugerido'?' sug-col':'');
      return `<td class="${extra.trim()}">${val}</td>`;
    }).join('')}
  </tr>`).join('');

  return `<div class="sec">
    <div class="sec-title">Projeção Anual — 3 Cenários</div>
    <div class="cmp-wrap">
      <table class="cmp-table"><thead>${head}</thead><tbody>${body}</tbody></table>
    </div>
  </div>`;
}

// ── Helpers cards narrativos ──────────────────────────────────────────
function brlAbrev(v) {
  if (!isFinite(v)) return '—';
  const abs = Math.abs(v), neg = v < 0;
  const pre = neg ? '−R$ ' : 'R$ ';
  if (abs >= 1e6) return pre + (abs/1e6).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' mi';
  if (abs >= 1e3) return pre + Math.round(abs/1e3).toLocaleString('pt-BR') + ' mil';
  return pre + abs.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
}

// ── Seção 2b: Cards narrativos ────────────────────────────────────────
function secNarrativa(result, d, precoSugerido, V12) {
  const { atual, sugerido, necessario } = result;
  return `<div class="narr-grid">
    ${_cardAtual(atual, d)}
    ${_cardSugerido(sugerido, atual, d, precoSugerido, V12)}
    ${_cardNecessario(atual, necessario, d, V12)}
  </div>
  ${sugerido ? _blocoElasticidade(atual, sugerido, V12) : ''}`;
}

function _blocoElasticidade(atual, sugerido, V12) {
  const mcUnitSugerido = sugerido.mcPct * sugerido.ticket;
  if (mcUnitSugerido <= 0) return '';

  const prejuizoAtual  = atual.lucroAnual < 0;
  const mcUnitAtual    = atual.mcPct * atual.ticket;
  const fixasAno       = atual.mcAnual - atual.lucroAnual;

  let volumeMinimo, perdaToleravel, projetosPerdiveis, texto;

  if (prejuizoAtual) {
    volumeMinimo      = fixasAno / mcUnitSugerido;
    perdaToleravel    = 1 - volumeMinimo / V12;
    projetosPerdiveis = Math.floor(Math.max(0, V12 - volumeMinimo));
    const perdaPct    = Math.max(0, (perdaToleravel * 100)).toFixed(0);
    texto = `Com o preço reajustado, cada venda contribui com <strong>${brl(mcUnitSugerido)}</strong> em vez de <strong>${brl(mcUnitAtual)}</strong>. Mesmo perdendo até <strong>${perdaPct}% do volume (${projetosPerdiveis.toLocaleString('pt-BR')} projetos)</strong>, a operação já sai do prejuízo. O reajuste por si só já melhora o resultado independentemente do volume.`;
  } else {
    volumeMinimo      = atual.mcAnual / mcUnitSugerido;
    perdaToleravel    = 1 - volumeMinimo / V12;
    projetosPerdiveis = Math.floor(Math.max(0, V12 - volumeMinimo));
    const perdaPct    = (perdaToleravel * 100).toFixed(0);
    const umEmCadaN   = perdaToleravel > 0 ? Math.round(1 / perdaToleravel) : 0;

    if (perdaToleravel < 0.03) {
      texto = `<span class="elast-alert">Atenção:</span> com o preço reajustado, cada venda contribui com <strong>${brl(mcUnitSugerido)}</strong>. A margem de segurança é pequena: a operação suporta perder apenas <strong>${perdaPct}% do volume (${projetosPerdiveis.toLocaleString('pt-BR')} projetos)</strong> sem ficar abaixo do resultado atual. <strong>A retenção de clientes no período de ajuste é crítica.</strong>`;
    } else {
      texto = `Com o preço reajustado, cada venda contribui com <strong>${brl(mcUnitSugerido)}</strong> em vez de <strong>${brl(mcUnitAtual)}</strong>. Isso significa que a operação pode perder até <strong>${perdaPct}% do volume (${projetosPerdiveis.toLocaleString('pt-BR')} projetos no ano)</strong> e ainda assim lucrar o mesmo que hoje. Na prática: mesmo perdendo cerca de 1 em cada <strong>${umEmCadaN}</strong> vendas por causa do reajuste, você não fica pior do que está.`;
    }
  }

  return `<div class="elast-block">
    <div class="elast-icon">?</div>
    <div>
      <div class="elast-title">E se eu perder vendas com o aumento?</div>
      <div class="elast-body">${texto}</div>
    </div>
  </div>`;
}

function _cardAtual(atual, d) {
  const meta      = atual.fatAnual * (d.lucroAlvo / 100);
  const lucrativo = atual.lucroAnual >= 0;
  const acimaMeta = atual.lucroAnual >= meta - 0.01;
  const numColor  = lucrativo ? 'var(--positive)' : 'var(--negative)';

  let texto;
  if (atual.lucroAnual < 0) {
    texto = `A operação encerra o ano com <strong>prejuízo de ${brlAbrev(Math.abs(atual.lucroAnual))}</strong>. A receita atual não cobre os custos totais.`;
  } else if (!acimaMeta) {
    texto = `A operação é lucrativa, mas encerra <strong>${brlAbrev(meta - atual.lucroAnual)} abaixo da meta</strong> de ${d.lucroAlvo}% de lucro líquido.`;
  } else {
    texto = `A precificação atual <strong>supera a meta</strong> de ${d.lucroAlvo}%. Operação saudável.`;
  }

  const peTexto = atual.mePE
    ? `Equilíbrio em <strong>${MESES[atual.mePE-1]} (mês ${atual.mePE})</strong>`
    : '<strong>Não atinge equilíbrio</strong> no ano corrente';

  return `<div class="narr-card">
    <div class="narr-title">Situação atual</div>
    <div class="narr-number" style="color:${numColor}">${brlAbrev(atual.lucroAnual)}</div>
    <div class="narr-sub">${pct(atual.lucroPct)} de lucro líquido</div>
    <div class="narr-sep"></div>
    <div class="narr-text">${texto}</div>
    <div class="narr-meta">${peTexto}</div>
  </div>`;
}

function _cardSugerido(sugerido, atual, d, precoSugerido, V12) {
  if (!sugerido) {
    return `<div class="narr-card rec">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px">
        <div class="narr-title">Preço sugerido</div>
        <div class="narr-badge green">Recomendado</div>
      </div>
      <div class="narr-number" style="color:var(--muted)">—</div>
      <div class="narr-sep"></div>
      <div class="narr-text">Não foi possível calcular o preço sugerido. Verifique a meta de lucro e as despesas variáveis.</div>
    </div>`;
  }

  const deltaPct      = (precoSugerido - d.ticket) / d.ticket * 100;
  const deltaStr      = (deltaPct >= 0 ? '+' : '−') + Math.abs(deltaPct).toFixed(1).replace('.',',') + '%';
  const lucroAdicional = sugerido.lucroAnual - atual.lucroAnual;

  const peTexto = sugerido.mePE
    ? `Equilíbrio em <strong>${MESES[sugerido.mePE-1]} (mês ${sugerido.mePE})</strong>`
    : 'Equilíbrio não atingido no ano';

  return `<div class="narr-card rec">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px">
      <div class="narr-title">Preço sugerido (${deltaStr})</div>
      <div class="narr-badge green">Recomendado</div>
    </div>
    <div class="narr-delta">
      <span class="narr-delta-num">+${brlAbrev(lucroAdicional)}</span>
      de lucro por ano com o mesmo volume de vendas. Reajuste de <strong>${deltaStr}</strong> no ticket, sem contratar, sem vender mais, sem aumentar despesa fixa.
    </div>
    <div class="narr-number" style="color:var(--positive);margin-top:2px">${brlAbrev(sugerido.lucroAnual)}</div>
    <div class="narr-sub">${pct(sugerido.lucroPct)} de lucro líquido</div>
    <div class="narr-sep"></div>
    <div class="narr-text">Reajuste de <strong>${brl(d.ticket)}</strong> para <strong>${brl(precoSugerido)}</strong> mantendo ${Math.ceil(V12).toLocaleString('pt-BR')} proj/ano. Meta de ${d.lucroAlvo}% atingida.</div>
    <div class="narr-meta">${peTexto}</div>
  </div>`;
}

function _cardNecessario(atual, necessario, d, V12) {
  if (atual.mcPct <= 0) {
    return `<div class="narr-card inviavel">
      <div class="narr-badge red">Inviável</div>
      <div class="narr-title" style="margin-top:6px">Volume necessário</div>
      <div class="narr-number" style="color:var(--negative)">—</div>
      <div class="narr-sep"></div>
      <div class="narr-text">Com margem de contribuição negativa, nenhum aumento de volume atinge a meta. <strong>A correção passa pelo preço:</strong> revise os custos ou ajuste o ticket para obter MC positiva.</div>
    </div>`;
  }

  if (!necessario) {
    return `<div class="narr-card inviavel">
      <div class="narr-badge orange">Indisponível</div>
      <div class="narr-title" style="margin-top:6px">Volume necessário</div>
      <div class="narr-number" style="color:var(--negative)">—</div>
      <div class="narr-sep"></div>
      <div class="narr-text">A MC atual (${pct(atual.mcPct)}) não supera o lucro alvo (${d.lucroAlvo}%) com margem suficiente. <strong>A correção passa pelo preço.</strong></div>
    </div>`;
  }

  const projNec     = Math.ceil(necessario.VnecProj);
  const deltaProj   = projNec - Math.ceil(V12);
  const deltaVolPct = (necessario.VnecProj - V12) / V12 * 100;
  const projMesAdic = Math.max(0, Math.ceil((necessario.VnecProj - V12) / 12));
  const isAlerta    = deltaVolPct > 30;
  const numStr      = (deltaVolPct >= 0 ? '+' : '−') + Math.abs(deltaVolPct).toFixed(1).replace('.',',') + '%';
  const pctVolStr   = Math.round(deltaVolPct);

  const peTexto = necessario.mePE
    ? `Equilíbrio em <strong>${MESES[necessario.mePE-1]} (mês ${necessario.mePE})</strong>`
    : 'Equilíbrio não atingido no ano';

  const textoExpl = `Este cenário lucra mais no papel, mas exige <strong>+${deltaProj.toLocaleString('pt-BR')} projetos (${pctVolStr}% a mais)</strong> com a premissa de despesas fixas constantes, o que raramente se sustenta: mais volume tende a exigir mais equipe, mais capital de giro e mais investimento em captação. O cenário Sugerido entrega a meta de ${d.lucroAlvo}% sem depender de nenhum crescimento.`;

  return `<div class="narr-card${isAlerta ? ' alerta' : ''}">
    <div class="narr-badge orange">${isAlerta ? 'Atenção — Capacidade' : 'Depende de Crescimento'}</div>
    <div class="narr-title" style="margin-top:6px">Volume necessário</div>
    <div class="narr-number" style="color:var(--teal)">${numStr}</div>
    <div class="narr-sub">${projNec.toLocaleString('pt-BR')} proj/ano · +${projMesAdic.toLocaleString('pt-BR')}/mês</div>
    <div class="narr-sep"></div>
    <div class="narr-text">${textoExpl}</div>
    <div class="narr-meta">${peTexto}</div>
  </div>`;
}

// ── Seção 4: Gráfico Break-Even ───────────────────────────────────────
function secChart(result) {
  const { atual, sugerido, FixasAno } = result;

  const PL=72, PR=24, PT=22, PB=46, W=660, H=280;
  const CW=W-PL-PR, CH=H-PT-PB;

  const cumOf = mesesCalc => {
    let s=0; return mesesCalc.map(m=>{s+=m.mcMes;return s;});
  };
  const cumA = cumOf(atual.mesesCalc);
  const cumS = sugerido ? cumOf(sugerido.mesesCalc) : null;

  const allV = [0, FixasAno, ...cumA, ...(cumS||[])];
  const maxY = Math.max(...allV)*1.12;
  const minY = Math.min(0, ...allV);
  const rng  = maxY - minY || 1;

  const xOf  = i  => PL + (i/11)*CW;
  const yOf  = v  => PT + CH - ((v-minY)/rng)*CH;

  const mkPath = cum => cum.map((v,i)=>(i===0?'M':'L')+xOf(i).toFixed(1)+','+yOf(v).toFixed(1)).join(' ');

  const nTick=5;
  const grid = Array.from({length:nTick+1},(_,i)=>minY+(rng*i/nTick)).map(v=>{
    const y=yOf(v).toFixed(1);
    const lab=Math.abs(v)>=1e6?(v/1e6).toFixed(1)+'M':Math.abs(v)>=1000?(v/1000).toFixed(0)+'K':v.toFixed(0);
    return `<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="#DFF0E8" stroke-width="1"/>
            <text x="${PL-6}" y="${y}" text-anchor="end" dominant-baseline="middle" font-size="9" fill="#736F64">${lab}</text>`;
  }).join('');

  const xLabels = MESES.map((m,i)=>
    `<text x="${xOf(i).toFixed(1)}" y="${H-10}" text-anchor="middle" font-size="10" fill="#736F64">${m}</text>`
  ).join('');

  const yFix = yOf(FixasAno).toFixed(1);
  const fixLine = `<line x1="${PL}" y1="${yFix}" x2="${W-PR}" y2="${yFix}" stroke="#B23A2E" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="${W-PR-2}" y="${parseFloat(yFix)-5}" text-anchor="end" font-size="9" fill="#B23A2E" font-weight="700">Custo Fixo Total</text>`;

  const zeroLine = minY<0 ? `<line x1="${PL}" y1="${yOf(0).toFixed(1)}" x2="${W-PR}" y2="${yOf(0).toFixed(1)}" stroke="#C0D9CC" stroke-width="1"/>` : '';

  let markers='';
  if(atual.mePE!==null)
    markers+=`<circle cx="${xOf(atual.mePE-1).toFixed(1)}" cy="${yFix}" r="5" fill="#183029" stroke="#fff" stroke-width="1.5"/>`;
  if(sugerido?.mePE!=null){
    const xSug = xOf(sugerido.mePE-1);
    const yFixN = parseFloat(yFix);
    const anchor = xSug > W*0.7 ? 'end' : 'middle';
    const dx = anchor==='end' ? -8 : 0;
    markers+=`<circle cx="${xSug.toFixed(1)}" cy="${yFix}" r="5" fill="#00B140" stroke="#fff" stroke-width="1.5"/>
      <line x1="${xSug.toFixed(1)}" y1="${(yFixN-7).toFixed(1)}" x2="${(xSug+dx).toFixed(1)}" y2="${(yFixN-20).toFixed(1)}" stroke="#00B140" stroke-width="1" stroke-dasharray="2,2"/>
      <text x="${(xSug+dx).toFixed(1)}" y="${(yFixN-24).toFixed(1)}" text-anchor="${anchor}" font-size="8.5" fill="#00B140" font-weight="700">Início do Lucro</text>`;
  }

  const svg=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block">
    ${grid}${zeroLine}${xLabels}${fixLine}
    <path d="${mkPath(cumA)}" fill="none" stroke="#183029" stroke-width="2.5" stroke-linejoin="round"/>
    ${cumS?`<path d="${mkPath(cumS)}" fill="none" stroke="#00B140" stroke-width="2.5" stroke-linejoin="round"/>` : ''}
    ${markers}
  </svg>`;

  const legend=`<div class="chart-legend">
    <div class="leg-item"><div class="leg-line" style="background:#183029"></div>MC acumulada — Atual</div>
    ${sugerido?`<div class="leg-item"><div class="leg-line" style="background:#00B140"></div>MC acumulada — Sugerido</div>`:''}
    <div class="leg-item">
      <div style="width:22px;height:3px;background:repeating-linear-gradient(90deg,#B23A2E 0,#B23A2E 6px,transparent 6px,transparent 10px)"></div>
      Custo Fixo Total (${brl(FixasAno)})
    </div>
    <div class="leg-item"><div class="leg-dot" style="background:#183029"></div>Mês de equilíbrio</div>
  </div>`;

  return `<div class="sec">
    <div class="sec-title">Break-Even Acumulado · Margem de Contribuição vs Despesas Fixas</div>
    <div class="chart-wrap">${svg}</div>
    ${legend}
  </div>`;
}

// ── Seção 5: Premissas ────────────────────────────────────────────────
function secPremissas(d, cbBase, tbBase, V12, extras) {
  const items = [
    {k:'Preço de venda atual',    v:brl(d.ticket)},
    {k:'Custo direto total',      v:brl(d.cdt)},
    {k:'Custo KIT',               v:brl(d.kit)},
    {k:'Comissão de vendas',      v:d.comissao+'% — base '+(cbBase==='total'?'venda total':'serviço')},
    {k:'Carga tributária',        v:d.tributo+'% — base '+(tbBase==='total'?'venda total':'serviço')},
    {k:'Outras despesas var.',    v:d.outras>0?d.outras+'%':'Não aplicável'},
    {k:'Despesas fixas / mês',    v:brl(d.despFixa)},
    {k:'Lucro alvo',              v:d.lucroAlvo+'%'},
    {k:'Projetos por ano',        v:num0(Math.ceil(V12))+' projetos'},
    ...(extras?.length?[{k:'Despesas extras',v:extras.map(e=>(e.nome||'Extra')+' '+e.valor+'%').join(' · ')}]:[]),
  ];
  return `<div class="sec">
    <div class="sec-title">Premissas Utilizadas</div>
    <div class="prem-grid">
      ${items.map(i=>`<div class="prem-item"><div class="k">${i.k}</div><div class="v">${i.v}</div></div>`).join('')}
    </div>
  </div>`;
}

// ── Seção 6: Recomendações do Auditor ────────────────────────────────
function secRecomendacoes(result, d, precoSugerido, V12) {
  const { atual, FixasAno } = result;
  const mcUnitAtual = atual.mcPct * atual.ticket;

  const pctReajuste = isFinite(precoSugerido) && d.ticket > 0
    ? (precoSugerido - d.ticket) / d.ticket * 100
    : null;

  const mcUnitNecessaria    = d.lucroAlvo / 100 * d.ticket + FixasAno / V12;
  const reducaoKitNecessaria = mcUnitNecessaria - mcUnitAtual;
  const pctReducaoKit        = d.kit > 0 ? reducaoKitNecessaria / d.kit * 100 : 0;
  const guardaKit            = pctReducaoKit > 15;

  const optA = pctReajuste !== null ? `
    <div class="opt-card opt-a">
      <div class="opt-label">Opção A</div>
      <div class="opt-title">Reajuste gradual de preço</div>
      <div class="opt-text">Reajustar gradualmente o preço dos novos orçamentos em
        <strong>${pctReajuste.toFixed(1).replace('.',',')}%</strong>
        (de <strong>${brl(d.ticket)}</strong> para <strong>${brl(precoSugerido)}</strong>),
        mantendo o volume atual de vendas.
      </div>
    </div>` : `
    <div class="opt-card opt-a">
      <div class="opt-label">Opção A</div>
      <div class="opt-title">Reajuste de preço</div>
      <div class="opt-text">Ajuste os parâmetros na análise para calcular o preço sugerido e dimensionar o reajuste necessário.</div>
    </div>`;

  const optB = `
    <div class="opt-card opt-b">
      <div class="opt-label">Opção B</div>
      <div class="opt-title">Negociação com fornecedores</div>
      <div class="opt-text">Negociar o Custo do Kit (atualmente em <strong>${brl(d.kit)}</strong>) para absorver a diferença sem repassar ao cliente.
        Uma redução de <strong>${brl(reducaoKitNecessaria)}</strong> por kit
        (<strong>${pctReducaoKit.toFixed(1).replace('.',',')}%</strong>)
        atinge a mesma meta de <strong>${d.lucroAlvo}%</strong> de lucro sem alterar o preço de venda.
      </div>
      ${guardaKit ? `<div class="opt-nota">Uma redução dessa magnitude dificilmente será obtida apenas via negociação. Considere combinar as opções A + B: reajuste parcial de preço e redução parcial de custo.</div>` : ''}
    </div>`;

  return `<div class="sec">
    <div class="sec-title">Recomendações do Auditor</div>
    <p class="rec-intro">Os itens abaixo são as principais sugestões para atingir a meta de <strong>${d.lucroAlvo}%</strong> de lucro:</p>
    <div class="opt-grid">${optA}${optB}</div>
    <div class="impl-block">
      <div class="impl-title">Como implementar</div>
      <ul class="impl-list">
        <li>Aplique o reajuste <strong>gradualmente</strong> em novas propostas, não retroativamente em contratos em andamento.</li>
        <li>Comunique o <strong>valor entregue</strong> (garantia, suporte, qualidade) antes de mencionar o novo preço.</li>
        <li>Monitore a <strong>taxa de conversão</strong> nas primeiras semanas para avaliar o impacto real no volume.</li>
      </ul>
    </div>
    <div class="cta-row">
      <a class="cta-btn-primary" href="${CTA_URL_ANALISE}">Refaça a análise com seus custos reais</a>
      <a class="cta-btn-secondary" href="${CTA_URL_CONTEUDO}" target="_blank" rel="noopener">Ver conteúdo e consultoria da FAVO</a>
    </div>
  </div>`;
}

function secFooter(authUser) {
  const ts = new Date().toLocaleString('pt-BR');
  return `<div class="rpt-footer">
    Gerado em ${ts} · ${authUser.email} · FAVO Educação — Auditor de Precificação Solar
  </div>`;
}

// ── Snapshot para diagnosticos ────────────────────────────────────────
async function salvarSnapshot(result, d, integ, proj, authUser, cbBase, tbBase) {
  try {
    const snap = sc => sc ? {
      ticket:sc.ticket, totalProj:sc.totalProj, fatAnual:sc.fatAnual,
      mcAnual:sc.mcAnual, mcPct:sc.mcPct, lucroAnual:sc.lucroAnual,
      lucroPct:sc.lucroPct, mePE:sc.mePE, VnecFat:sc.VnecFat, VnecProj:sc.VnecProj,
    } : null;

    await db.from('diagnosticos').insert({
      user_id:       authUser.id,
      integrador_id: integ?.id || null,
      projeto_id:    proj?.id  || null,
      snapshot: {
        gerado_em: new Date().toISOString(),
        parametros: {
          ticket:d.ticket, cdt:d.cdt, kit:d.kit,
          comissao:d.comissao, comissaoBase:cbBase,
          tributo:d.tributo,  tributoBase:tbBase,
          outras:d.outras, despFixa:d.despFixa, lucroAlvo:d.lucroAlvo,
        },
        cenarios: {
          atual:      snap(result.atual),
          sugerido:   snap(result.sugerido),
          necessario: snap(result.necessario),
        },
      },
    });
  } catch(e) {
    console.warn('Snapshot não salvo:', e.message);
  }
}
